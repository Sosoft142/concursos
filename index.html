      var tom=tetoTom(usadoMes, teto);
      tetoBloco='<div class="ab-teto">'
        +'<div class="ab-teto-top"><span>Gasto de '+esc(mesLabel(ym))+'</span>'
          +'<b class="money" style="color:'+(dark?tom.textD:tom.text)+'">'+esc(fmtBRL(usadoMes))+' / '+esc(fmtBRL(teto))+'</b></div>'
        +'<span class="fbar"><span style="width:'+pct+'%;background:'+tom.dot+'"></span></span>'
        +'<div class="ab-teto-msg">'+(estourou
            ? 'Passou do teto em <b>'+esc(fmtBRL(usadoMes-teto))+'</b>.'
            : 'Ainda cabem <b>'+esc(fmtBRL(rest))+'</b> no teto do mês.')
          +' <button type="button" class="link-btn" data-act="edit-teto" data-sid="'+esc(cat.id)+'">ajustar o teto</button></div>'
        +'</div>';
    } else {
      tetoBloco='<div class="ab-teto sem-teto"><span>Gasto de '+esc(mesLabel(ym))+': <b class="money">'+esc(fmtBRL(usadoMes))+'</b></span>'
        +' <button type="button" class="link-btn" data-act="edit-teto" data-sid="'+esc(cat.id)+'">definir um teto</button></div>';
    }

    var cards='<div class="ab-stats">'
      +'<div class="ab-stat"><div class="ab-stat-n money">'+esc(fmtBRL(st.totV))+'</div><div class="ab-stat-l">total no histórico</div></div>'
      +'<div class="ab-stat"><div class="ab-stat-n">'+(st.medio!=null?esc(fmtPreco(st.medio)):'—')+'</div><div class="ab-stat-l">preço médio por litro</div></div>'
      +'<div class="ab-stat"><div class="ab-stat-n">'+(st.totL?esc(fmtLitros(st.totL)):'—')+'</div><div class="ab-stat-l">litros no total</div></div>'
      +'</div>';

    var hoje=todayISO();
    var form='<div class="ab-add"><div class="ab-add-h">'+svg(IC.plus,14)+' Registrar um abastecimento</div>'
      +'<div class="ab-grid">'
        +'<label class="ab-f"><span>Data</span><input type="date" value="'+hoje+'" data-fdate></label>'
        +'<label class="ab-f"><span>Combustível</span><input type="text" list="ab-tipos" placeholder="Gasolina" data-fobs maxlength="30"></label>'
        +'<label class="ab-f"><span>Valor pago</span><input type="text" inputmode="decimal" placeholder="R$ 0,00" data-fval></label>'
        +'<label class="ab-f"><span>Preço/L</span><input type="text" inputmode="decimal" placeholder="0,00" data-fpreco></label>'
        +'<label class="ab-f"><span>Litros</span><input type="text" inputmode="decimal" placeholder="cálculo automático" data-flitros></label>'
      +'</div>'
      +'<datalist id="ab-tipos"><option value="Gasolina"></option><option value="Etanol"></option><option value="Diesel"></option><option value="GNV"></option></datalist>'
      +'<div class="ab-add-foot"><span class="hint">Preencha valor e preço/L que os litros saem sozinhos.</span>'
        +'<button class="btn-wine" data-act="addavulso" data-sid="'+esc(cat.id)+'">'+svg(IC.check,15)+' Registrar</button></div>'
      +'</div>';

    var lista = st.n ? abastPorMes(cat)
      : '<div class="cart-vazio">Nenhum abastecimento registrado ainda.</div>';

    abastEl.innerHTML=tetoBloco+cards+form
      +'<div class="ab-log-h">Histórico<span class="gn">'+st.n+'</span></div>'+lista;

    // liga o cálculo automático de litros a partir de valor ÷ preço
    var box=abastEl.querySelector('.ab-add');
    if(box){
      var gv=function(sel){ return box.querySelector(sel); };
      var recalc=function(){
        var val=parseMoeda(gv('[data-fval]').value), pr=parseMoeda(gv('[data-fpreco]').value);
        var campoL=gv('[data-flitros]');
        if(val!=null && pr && !campoL.dataset.tocado){ campoL.value=(val/pr).toFixed(2).replace('.',','); }
      };
      gv('[data-fval]').addEventListener('input', recalc);
      gv('[data-fpreco]').addEventListener('input', recalc);
      gv('[data-flitros]').addEventListener('input', function(){ this.dataset.tocado='1'; });
    }

    foot.innerHTML='Abastecimento · '+st.n+' registro(s)'
      +textoSalvo(false)+'<br>'
      +atalhos('<span class="kbd">n</span> novo abastecimento · <span class="kbd">s</span> trocar de aba · <span class="kbd">p</span> '+esc(rotuloMetas())+' · <span class="kbd">Esc</span> fechar')
      +selo();
    saveUI();
  }
  function addAbastecimento(sid){
    var cat=findCat(sid); if(!cat) return;
    var box=abastEl.querySelector('.ab-add'); if(!box) return;
    var val=function(sel){ var el=box.querySelector(sel); return el?el.value:''; };
    var d=val('[data-fdate]'), v=val('[data-fval]'), o=val('[data-fobs]');
    var pr=parseMoeda(val('[data-fpreco]')), lt=parseMoeda(val('[data-flitros]'));
    if(!isoOk(d)){ alert('Escolha uma data válida.'); return; }
    var valor=parseMoeda(v);
    if(valor==null || valor<=0){ alert('Digite um valor maior que zero.'); return; }
    if(lt==null && pr) lt=Math.round((valor/pr)*100)/100;   // litros = valor ÷ preço
    if(pr==null && lt) pr=Math.round((valor/lt)*100)/100;
    var igual=cat.avulsos.some(function(a){ return a.d===d && a.v===valor; });
    if(igual && !confirm('Já existe um abastecimento de '+fmtBRL(valor)+' em '+fmtDate(d)+'.\n\nRegistrar mesmo assim?')) return;
    cat.avulsos.push(normAvulso({d:d, v:valor, o:o, preco:pr, litros:lt}));
    persist(); renderAll();
    anunciar('Abastecimento de '+fmtBRL(valor)+' registrado em '+fmtDate(d));
  }
  function novoAbastecimento(){
    var cat=catCombustivel();
    if(!cat){ view='abast'; applyView(); renderMain(); return; }
    var campo=abastEl.querySelector('.ab-add [data-fval]');

  // ---- gastos avulsos ----
  /* Dois toques rápidos no botão gravavam o mesmo gasto duas vezes, em
     silêncio — e é esse número que decide se o teto do mês estourou. */
  function addAvulso(sid, d, v, o){
    var cat=findCat(sid); if(!cat) return;
    if(!isoOk(d)){ alert('Escolha uma data válida para o gasto.'); return; }
    var val=parseMoeda(v);
    if(val==null || val<=0){ alert('Digite um valor maior que zero.'); return; }
    var igual=cat.avulsos.some(function(a){ return a.d===d && a.v===val; });
    if(igual && !confirm('Já existe um gasto de '+fmtBRL(val)+' em '+fmtDate(d)+'.\n\nRegistrar mesmo assim?')) return;
    cat.avulsos.push(normAvulso({d:d, v:val, o:o}));
    persist(); renderAll();
    anunciar('Gasto de '+fmtBRL(val)+' registrado em '+fmtDate(d));
  }
  function delAvulso(sid, d, v){
    var cat=findCat(sid); if(!cat) return;
    var val=parseMoeda(v);
    for(var i=0;i<cat.avulsos.length;i++){
      if(cat.avulsos[i].d===d && cat.avulsos[i].v===val){ cat.avulsos.splice(i,1); break; }
    }
    persist(); renderAll();
    anunciar('Gasto de '+fmtDate(d)+' removido');
  }

  // ---- aba: reservas ----
  var DIA=86400000;
  function d2n(iso){ var p=String(iso).split('-'); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
  function n2d(ms){ var d=new Date(ms); var p=function(n){ return (n<10?'0':'')+n; };
    return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate()); }
  function marcosOrd(){
    return metas.marcos.slice().sort(function(a,b){
      var ka=a.start||a.end||'￿', kb=b.start||b.end||'￿';
      if(ka!==kb) return ka<kb?-1:1;
      var kc=a.end||'￿', kd=b.end||'￿';
      if(kc!==kd) return kc<kd?-1:1;
      return 0;
    });
  }
  function marcoAtrasado(e){
    if(e.status==='done' || !e.end) return false;
    var d=dayDiff(e.end); return d!=null && d<0;
  }
  function confOrd(){
    return metas.conferencias.slice().sort(function(a,b){
      var ka=a.date||'', kb=b.date||'';
      if(ka!==kb) return ka<kb?-1:1;
      return 0;
    });
  }
  function ultimaConf(){
    var l=confOrd().filter(function(o){ return o.date && o.date<=todayISO(); });
    return l.length ? l[l.length-1] : (confOrd().length?confOrd()[confOrd().length-1]:null);
  }
  function saldoAtual(){
    var c=ultimaConf();
    return c && c.saldo!=null ? c.saldo : null;
  }
  function renderMarcosLista(){
    return '<div class="elist">'+marcosOrd().map(function(e){
      var cfg=ETAPA[e.status]||ETAPA.todo;
      var late=marcoAtrasado(e);
      var cor=etapaCor(cfg, late);
      var quando = (e.start&&e.end) ? (fmtDate(e.start)+' → '+fmtDate(e.end))
                 : (e.end ? 'até '+fmtDate(e.end) : (e.start ? 'a partir de '+fmtDate(e.start) : 'sem data'));
      var d=e.end?dayDiff(e.end):null;
      var extra = late ? '<span class="atras"> · '+relLabel(d)+'</span>'
                : (d!=null && d>=0 && d<=7 && e.status!=='done' ? '<span class="agora"> · '+relLabel(d)+'</span>' : '');
      return '<div class="eitem'+(late?' late':'')+(e.status==='done'?' done':'')+'">'
        +'<span class="edot" style="background:'+cor+'"></span>'
        +'<div class="emain"><div class="ename">'+esc(e.name)+'</div>'
          +'<div class="emeta">'+esc(quando)+(e.valor!=null?' · <span class="meta-num">'+esc(fmtBRL(e.valor))+'</span>':'')+extra+'</div>'
          +(e.notes?'<div class="enotes">'+esc(e.notes)+'</div>':'')+'</div>'
        +'<div class="eacts">'
          +'<button class="echip" data-act="ciclomarco" data-id="'+esc(e.id)+'" style="background:'+chipOf(cfg)+';color:'+textOf(cfg)+'">'
            +'<span class="pill-dot" style="background:'+cor+'"></span>'+esc(cfg.label)+'</button>'
          +'<button class="icon-btn" data-act="editmarco" data-id="'+esc(e.id)+'" aria-label="'+esc('Editar '+e.name)+'">'+SVG_PENCIL+'</button>'
        +'</div></div>';
    }).join('')+'</div>';
  }
  function renderMarcos(){
    if(!metas.marcos.length){
      return '<div class="tcc-vazio"><p>Nenhum marco por enquanto.</p>'
        +'<span class="hint">Marcos são os passos da sua reserva: separar a emergência, juntar metade, chegar ao objetivo.</span>'
        +'<div class="acoes"><button class="btn-wine" data-act="novomarco">'+svg(IC.plus,15)+' Criar um marco</button>'
        +'<button class="btn-ghost" data-act="marcossugeridos">Usar uma sugestão</button></div></div>';
    }
    var done=0; metas.marcos.forEach(function(e){ if(e.status==='done') done++; });
    var pct=Math.round(done/metas.marcos.length*100);
    return '<div class="tcc-prog"><span style="width:'+pct+'%"></span></div>'+renderMarcosLista();
  }
  function renderConferencias(){
    var lista=confOrd().slice().reverse();
    if(!lista.length){
      return '<div class="tcc-vazio"><p>Nenhuma conferência de saldo.</p>'
        +'<span class="hint">Anote o saldo de vez em quando: é assim que dá para ver se a reserva está crescendo.</span>'
        +'<div class="acoes"><button class="btn-wine" data-act="novaconf">'+svg(IC.plus,15)+' Anotar o saldo de hoje</button></div></div>';
    }
    var ordem=confOrd();
    return '<div class="olist">'+lista.map(function(o,i){
      var futura=o.date && o.date>todayISO();
      var idx=ordem.indexOf(o);
      var ant = idx>0 ? ordem[idx-1] : null;
      var delta = (ant && ant.saldo!=null && o.saldo!=null) ? Math.round((o.saldo-ant.saldo)*100)/100 : null;
      var deltaHtml = delta==null ? '' :
        '<span class="odelta '+(delta>=0?'up':'down')+'">'+(delta>=0?'+':'−')+esc(fmtBRL(Math.abs(delta)))+'</span>';
      return '<div class="oitem'+(i===0&&!futura?' ultima':'')+(futura?' futura':'')+'">'
        +'<div class="odate"><b>'+esc(fmtDate(o.date))+'</b><span>'+esc(relLabel(dayDiff(o.date)))+'</span></div>'
        +'<div class="omain">'+(futura?'<span class="obadge">programada</span>':'')
          +'<div class="olabel">Saldo conferido</div>'
          +'<div class="otxt"><span class="osaldo">'+esc(o.saldo!=null?fmtBRL(o.saldo):'—')+'</span>'+deltaHtml+'</div>'
          +(o.obs?'<div class="oprox"><div class="olabel">Observações</div><div class="otxt">'+esc(o.obs)+'</div></div>':'')
        +'</div>'
        +'<div class="eacts"><button class="icon-btn" data-act="editconf" data-id="'+esc(o.id)+'" aria-label="Editar conferência">'+SVG_PENCIL+'</button></div>'
        +'</div>';
    }).join('')+'</div>';
  }
  function renderObjetivo(){
    var saldo=saldoAtual(), obj=metas.objetivo;
    /* Sem objetivo nem prazo, o hero ficava sem número nenhum e o saldo — a
       coisa que a pessoa abre a aba para ver — ficava lá no fim, na última
       conferência. Havendo saldo conferido, ele sobe. */
    if(obj==null && !metas.prazo && saldo==null) return '';
    var pct = (obj && saldo!=null) ? Math.max(0, Math.min(100, Math.round(saldo/obj*100))) : null;
    var d = metas.prazo ? dayDiff(metas.prazo) : null;
    var cls = d==null ? '' : (d<0?'urgente':(d<=30?'perto':''));
    var titulo = obj!=null
      ? (saldo!=null ? esc(fmtBRL(saldo))+' de '+esc(fmtBRL(obj)) : 'Objetivo: '+esc(fmtBRL(obj)))
      : (saldo!=null ? esc(fmtBRL(saldo)) : esc(metas.prazoLabel));
    var desc;
    if(obj!=null && saldo!=null){
      var falta=Math.round((obj-saldo)*100)/100;
      desc = falta>0 ? ('Faltam <b>'+esc(fmtBRL(falta))+'</b>'
              +(metas.prazo && d!=null && d>0 ? ' — cerca de '+esc(fmtBRL(Math.round(falta/Math.max(1,Math.round(d/30))*100)/100))+' por mês até '+esc(fmtDate(metas.prazo)) : ''))
           : 'Objetivo alcançado.';
    } else {
      desc = metas.prazo
        ? esc(metas.prazoLabel)+' em '+esc(fmtDate(metas.prazo))
        : (saldo!=null
            ? 'Saldo da última conferência, em '+esc(fmtDate((ultimaConf()||{}).date||''))
              +'. <button type="button" class="link-btn" data-act="editmetas">definir um objetivo</button>'
            : 'Sem objetivo definido.');
    }
    return '<div class="prazo '+cls+'">'
      +'<span class="prazo-ic">'+svg(IC.porco,20)+'</span>'
      +'<div class="prazo-main"><div class="prazo-t">'+titulo+'</div>'

        +(pct!=null?'<div class="prazo-bar"><span style="width:'+pct+'%"></span></div>':'')+'</div>'
      +(d!=null?'<div class="prazo-n">'+(d<0?('−'+(-d)):d)+'<small>'+(d<0?'dias atrás':'dias')+'</small></div>':'')
      +'</div>';
  }

  function criarMarcosSugeridos(){
    var fim = metas.prazo || '';
    var ini = todayISO();
    if(!fim){
      var d=new Date(); d.setMonth(d.getMonth()+6); fim=diaLocal(d);
    }
    var t0=d2n(ini), t1=d2n(fim);
    if(t1<=t0) t1=t0+180*DIA;
    var somaPesos=0; MARCOS_SUGERIDOS.forEach(function(s){ somaPesos+=s.peso; });
    var cur=t0;
    MARCOS_SUGERIDOS.forEach(function(s){
      var dur=Math.max(DIA*3, Math.round((t1-t0)*(s.peso/somaPesos)));
      var start=cur, end=Math.min(t1, cur+dur);
      metas.marcos.push(normMarco({name:s.name, start:n2d(start), end:n2d(end), status:'todo'}));
      cur=end;
    });
    persist(); renderMetas();
    anunciar(MARCOS_SUGERIDOS.length+' marcos criados');
  }

  function quandoTxt(iso){
    if(!iso) return '';
    /* iso vem de toISOString() (UTC). Fatiar a string dava o dia UTC, que à
       noite no Brasil já é o dia seguinte. O dia tem de ser o LOCAL. */
    var q=new Date(iso); if(isNaN(q.getTime())) return '';
    var d=dayDiff(diaLocal(q));
    var min=Math.round((Date.now()-new Date(iso).getTime())/60000);
    if(d===0) return min<1?'agora':(min<60?'há '+min+' min':'hoje');
    return relLabel(d);
  }

  /* Toda ação da lista redesenha o HTML e destrói o botão que estava focado —
     o foco caía no <body> e quem navega por teclado voltava ao topo da página a
     cada clique. Aqui a identidade do controle é guardada antes e recuperada
     depois. */
  function marcaDoFoco(){
    var el=document.activeElement;
    if(!el || el===document.body) return null;
    var alvo=el.closest('[data-act]');
    if(!alvo) return el.id ? {id:el.id} : null;
    return {act:alvo.getAttribute('data-act'), tid:alvo.getAttribute('data-id'),
            k:alvo.getAttribute('data-k'), t:alvo.getAttribute('data-t')};
  }
  function devolverFoco(m){
    if(!m) return;
    var sel;
    if(m.id){ sel='#'+m.id; }
    else {
      sel='[data-act="'+m.act+'"]';
      if(m.tid) sel+='[data-id="'+m.tid+'"]';
      if(m.k) sel+='[data-k="'+m.k+'"]';
      if(m.t) sel+='[data-t="'+m.t+'"]';
    }
    var el;
    try{ el=document.querySelector(sel); }catch(e){ return; }
    if(el && el.focus) try{ el.focus({preventScroll:true}); }catch(e2){ el.focus(); }
  }

  function modalOpen(){ return !!document.getElementById('overlay'); }
  function closeModal(){
    var o=document.getElementById('overlay'); if(o) o.parentNode.removeChild(o);
    // devolve o foco para o botão que abriu o modal, se ele ainda existir
    if(focoAnterior && document.contains(focoAnterior)){ try{ focoAnterior.focus(); }catch(e){} }
    focoAnterior=null;
  }
  var focoAnterior=null;
  /* Um modal precisa (a) receber o foco, (b) segurar o Tab dentro dele e
     (c) devolver o foco a quem o abriu. Sem isso, quem navega por teclado sai
     do modal sem perceber e fica preso no fundo da página. */
  function focaveis(el){
    return Array.prototype.filter.call(
      el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'),
      function(n){ return n.offsetWidth>0 || n.offsetHeight>0 || n===document.activeElement; });
  }
  function prenderFoco(overlay){
    overlay.addEventListener('keydown', function(e){
      if(e.key!=='Tab') return;
      var f=focaveis(overlay); if(!f.length) return;
      var pri=f[0], ult=f[f.length-1];
      if(e.shiftKey && document.activeElement===pri){ e.preventDefault(); ult.focus(); }
      else if(!e.shiftKey && document.activeElement===ult){ e.preventDefault(); pri.focus(); }
    });
  }
  /* Enter dentro de um modal não pode disparar a ação principal quando o foco
     está no Cancelar ou no X — era assim que o primeiro Enter de quem navega
     por teclado adiava uma conta sem querer. */
  function enterConfirma(overlay, acao){
    overlay.addEventListener('keydown', function(e){
      if(e.key!=='Enter') return;
      var alvo=e.target;
      if(alvo && (alvo.tagName==='TEXTAREA' || alvo.tagName==='BUTTON' || alvo.tagName==='A')) return;

  function buildOverlay(html){
    closeModal();
    // um menu flutuante aberto não pode sobreviver por cima do modal
    if(openMenuId!==null){ openMenuId=null; renderStatusMenu(); }
    var overlay=document.createElement('div');
    overlay.className='overlay'; overlay.id='overlay';
    overlay.innerHTML=html;
    app.appendChild(overlay);
    overlay.addEventListener('mousedown', function(e){ if(e.target===overlay) closeModal(); });
    focoAnterior = (document.activeElement && document.activeElement!==document.body) ? document.activeElement : null;
    var cx=overlay.querySelector('.modal-head h2');
    var dlg=overlay.querySelector('.modal');
    if(cx && dlg){ cx.id='modal-titulo'; dlg.setAttribute('aria-labelledby','modal-titulo'); }
    prenderFoco(overlay);
    setTimeout(function(){
      if(!overlay.parentNode) return;
      if(overlay.contains(document.activeElement)) return;
      var f=focaveis(overlay);
      if(f.length) f[0].focus();
    }, 0);

  // ---- períodos arquivados ----
  /* Nome sugerido: o período configurado, ou o mês em que estamos. */
  function periodoSugerido(){
    if(appCfg.periodo) return appCfg.periodo;
    var d=new Date();
    return MES_NOME[d.getMonth()]+'/'+d.getFullYear();
  }
  function periodoSeguinte(atual){
    var s=String(atual||'').trim();
    var m=/^(\d{4})\s*[\/.-]\s*(\d{1,2})$/.exec(s);
    if(m){ var t=(+m[1])*12+(+m[2]-1)+1; return Math.floor(t/12)+'/'+pad2((t%12)+1); }
    var m2=/^([a-zç]+)\s*[\/ ]\s*(\d{4})$/i.exec(s);
    if(m2){
      var i=MES_NOME.indexOf(m2[1].toLowerCase());
      if(i>=0){ var n=i+1, ano=+m2[2]; if(n>11){ n=0; ano++; } return MES_NOME[n]+'/'+ano; }
    }
    return '';
  }
  function contaArquivo(a){
    var n=a.categorias.length, l=a.lancamentos.length;
    return n+' '+(n===1?'categoria':'categorias')+' · '+l+' '+(l===1?'lançamento':'lançamentos');
  }
  function temConteudoVivo(){
    return !!(categorias.length || lancamentos.length
      || (metas && ((metas.marcos&&metas.marcos.length) || (metas.conferencias&&metas.conferencias.length) || metas.titulo)));
  }
  /* Arquivar NÃO apaga: move o período inteiro para a lista e deixa a mesa
     limpa. Restaurar faz o caminho de volta, arquivando antes o que estiver na
     mesa — em nenhum dos dois sentidos alguma coisa deixa de existir. */
  function arquivarAtual(nome){
    if(!temConteudoVivo()) return null;
    var a=normArquivo({nome:nome, em:todayISO(), categorias:categorias, lancamentos:lancamentos, metas:metas});
    arquivos.unshift(a);
    categorias=[]; lancamentos=[]; metas=normMetas(null);
    limparFiltros();
    if(view==='metas') view='mes';
    return a;
  }
  /* Busca, etiqueta e "falta pagar" são do período que está na tela. Ao trocar
     de período, a caixa de busca continuava com o termo antigo escrito. */
  function limparFiltros(){
    catAtualId=null; query=''; fTag=''; soPendentes=false;
    tetoAberto=false; openMenuId=null; mesOff=0;
    if(searchInput){ searchInput.value=''; }
    if(clearX){ clearX.style.display='none'; }

  function acharArquivo(id){
    for(var i=0;i<arquivos.length;i++) if(arquivos[i].id===id) return arquivos[i];
    return null;
  }
  function restaurarArquivo(id){
    var a=acharArquivo(id); if(!a) return;
    var vivo=temConteudoVivo();
    if(!confirm('Trazer "'+a.nome+'" de volta para a tela?'
      +(vivo?'\n\nO que está aberto agora será guardado antes, com o nome do período atual — nada se perde.':'')
      +'\n\nContinuar?')) return;
    if(vivo) arquivarAtual(periodoSugerido());
    var idx=-1;
    for(var i=0;i<arquivos.length;i++) if(arquivos[i].id===id){ idx=i; break; }
    if(idx<0) return;
    var alvo=arquivos.splice(idx,1)[0];
    categorias=alvo.categorias; lancamentos=alvo.lancamentos; metas=alvo.metas;
    appCfg=normCfg(Object.assign({}, appCfg, {periodo:alvo.nome}));
    limparFiltros(); ajustarCategoriaAtual();
    persist(); saveUI(); aplicarCfgNaPagina(); closeModal(); renderAll();
    avisoNaTela('"'+alvo.nome+'" está de volta na tela.');
  }

    if(!confirm('Apagar o período "'+a.nome+'" para sempre?\n\n'+contaArquivo(a)+'\n\nIsto não pode ser desfeito.')) return;

  function depoisDe(t){

  function planoAdiamento(t, comSeguintes){
    var cat=findCat(t.catId);
    var plano=[{item:t, de:t.venc, para:proximoVenc(cat, t.venc)}];
    if(comSeguintes){
      depoisDe(t).sort(function(a,b){ return a.venc<b.venc?-1:1; }).forEach(function(x){
        plano.push({item:x, de:x.venc, para:proximoVenc(cat, x.venc)});
      });
    }
    return plano;
  }

  // ---- edição rápida do valor pago ----
  /* Troca o número por um campo ali mesmo, sem re-renderizar a lista —
     re-renderizar mataria o foco no meio da digitação. */
  function abrirEdicaoPago(btn){
    var id=btn.getAttribute('data-id');
    var t=findLanc(id); if(!t) return;
    var v=valorDe(t);
    var atual=parseMoeda(t.pago);
    var inp=document.createElement('input');
    inp.type='text'; inp.inputMode='decimal'; inp.className='pedit-inp';
    inp.value = atual!=null ? String(atual).replace('.',',') : '';
    inp.setAttribute('aria-label','Quanto já foi pago');
    btn.style.display='none';
    btn.parentNode.insertBefore(inp, btn);
    inp.focus(); inp.select();
    var fechado=false;
    function encerrar(salvar){
      if(fechado) return; fechado=true;
      if(salvar){
        var n=parseMoeda(inp.value);
        if(inp.value.trim()===''){ t.pago=null; }
        else if(n!=null && n>=0){
          t.pago = (v!=null) ? Math.min(n, v) : n;
          /* Digitar o valor cheio é o jeito natural de dizer "quitei". */
          if(v!=null && n>=v) t.status='pago';
          else if(t.status==='pendente') t.status='parcial';
        }
        persist();
      }
      if(inp.parentNode) inp.parentNode.removeChild(inp);
      btn.style.display='';
      renderMain();
    }
    inp.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); encerrar(true); }
      else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); encerrar(false); }
    });
    inp.addEventListener('blur', function(){ encerrar(true); });
    inp.addEventListener('click', function(e){ e.stopPropagation(); });
  }

      var alvo=caixaAc.querySelector('[tabindex="0"]'); if(alvo) alvo.focus();
    });

        +(vivo?'':' disabled')+'>'

  // ---- export / import ----
  function stamp(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  function downloadJson(data, filename){
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.parentNode.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  }
  /* Tocar em baixar e não ver nada acontecer parece falha: no celular o
     download some numa barrinha do navegador. Aqui a confirmação é da tela. */
  function doExport(){
    downloadJson(payload(), 'organizador-contas-'+stamp()+'.json');
    backupEm=nowISO(); saveUI(); renderLembrete(); renderFileBtn();
    avisoNaTela('Cópia de segurança baixada. Guarde o arquivo em algum lugar seguro.');
  }
  var toastTimer=null;
  function avisoNaTela(msg, tipo){
    anunciar(msg);
    var el=document.getElementById('toast');
    if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast';
      el.setAttribute('role','status'); document.body.appendChild(el); }
    el.className='toast '+(tipo||'ok')+' on';
    el.textContent=msg;
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toastTimer=null; el.className='toast '+(tipo||'ok'); }, 4200);
  }
  function doImport(file){
    var reader=new FileReader();
    reader.onload=function(){
      var obj;
      try{ obj=JSON.parse(reader.result); }catch(e){ alert('Não consegui ler esse arquivo. Verifique se é um JSON exportado por este app.'); return; }
      if(!obj || !Array.isArray(obj.categorias)){ alert('Esse JSON não parece ser um backup deste app (não encontrei categorias).'); return; }
      /* Trocar as categorias mantendo os lançamentos antigos deixaria todos eles
         órfãos: apontando para categorias que não existem mais. */
      if(!temChave(obj,'lancamentos')){
        alert('Este arquivo tem as categorias mas não a lista de lançamentos.\n\nNão parece um backup completo, então nada foi alterado.');
        return; }
      var levaMetas = Object.prototype.hasOwnProperty.call(obj,'metas');
      if(!confirm('Restaurar vai SUBSTITUIR as categorias e os lançamentos atuais'
        +(levaMetas?', e também tudo da aba '+rotuloMetas()+' (marcos, conferências, objetivo)':'')
        +'.\n\nO que está aqui agora: '+categorias.length+' categoria(s) e '+lancamentos.length+' lançamento(s).'
        +'\nO que vem do arquivo: '+obj.categorias.length+' categoria(s) e '+obj.lancamentos.length+' lançamento(s).'
        +'\n\nUma cópia do estado atual será baixada antes. Continuar?')) return;
      downloadJson(payload(), 'backup-antes-de-restaurar-'+stamp()+'.json');
      var d=normalizarTudo(obj.categorias, obj.lancamentos);
      categorias=d.categorias; lancamentos=d.lancamentos;
      metas=metasRecebidas(obj, metas);
      /* A chave presente manda, a chave ausente não é um pedido para apagar. */
      if(obj.cfg && typeof obj.cfg==='object'){ appCfg=normCfg(obj.cfg); aplicarCfgNaPagina(); }
      if(Array.isArray(obj.arquivos)) arquivos=normArquivos(obj.arquivos);
      catAtualId=null; ajustarCategoriaAtual();
      query=''; fTag=''; searchInput.value=''; clearX.style.display='none';
      closeModal();
      persist(); renderAll();
      alert('Restaurado: '+categorias.length+' categoria(s) e '+lancamentos.length+' lançamento(s).');
    };
    reader.readAsText(file);
  }

  function clearSearch(){
    if(searchTimer){ clearTimeout(searchTimer); searchTimer=null; }
    // o X limpa a BUSCA; o filtro "falta pagar" tem botão próprio
    query=''; fTag=''; searchInput.value=''; clearX.style.display='none';
    renderTagbar(); renderTable();
  }

  // ---- mount ----
  function mount(){
    app=document.getElementById('app');
    app.innerHTML=
      '<header class="hero" id="hero"></header>'
      +'<div class="lembrete" id="lembrete" style="display:none"></div>'
      +'<div class="instalar" id="instalar" style="display:none"></div>'
      +'<div class="viewbar">'
        +'<div class="vswitch" id="vswitch">'
          +'<button data-v="mes" aria-pressed="false">'+svg(IC.cal,15)+' Mês</button>'
          +'<button data-v="cartoes" aria-pressed="false">'+svg(IC.cartao,15)+' Cartões</button>'
          +'<button data-v="abast" aria-pressed="false">'+svg(IC.bomba,15)+' Abastecimento</button>'
          +'<span class="vsep" id="vsep" aria-hidden="true"></span>'
          +'<button class="tcc-tab" id="metasTab" data-v="metas" aria-pressed="false">'+svg(IC.porco,15)+' '+esc(rotuloMetas())+'</button>'
        +'</div>'
        +'<div class="viewbar-right">'
          +'<button class="btn-ghost sm" id="fileBtn"></button>'
          +'<span id="avisos" class="sr-only" role="status" aria-live="polite"></span>'
          +'<button class="icon-toggle" id="helpBtn" title="Ajuda" aria-label="Ajuda">?</button>'
          +'<button class="icon-toggle" id="prefsBtn" title="Menu e preferências" aria-label="Menu e preferências">'+svg(IC.menu,17)+'</button>'
          +'<button class="icon-toggle" id="theme" title="Modo escuro" aria-label="Modo escuro"></button></div>'
      +'</div>'
      +'<div class="subjects" id="cats"></div>'
      +'<section class="panel" id="panel"></section>'
      +'<div class="toolbar" id="toolbar">'
        +'<div class="search" id="searchWrap"><span style="display:inline-flex;opacity:.5">'+svg(IC.search,15)+'</span>'
          +'<label for="q" class="sr-only">Buscar nesta categoria</label>'
          +'<input id="q" placeholder="Buscar nesta categoria…">'
          +'<button class="clear-x" id="clearx" aria-label="Limpar busca" style="display:none">'+svg(IC.x,13)+'</button></div>'
        +'<div class="sort-mob" id="sortMob"><label for="sortSel">Ordenar:</label> <select class="tool-select" id="sortSel">'
          +'<option value="date">Vencimento</option><option value="valor">Valor</option>'
          +'<option value="parcela">Parcela</option><option value="onde">Onde / quem</option>'
          +'<option value="status">Situação</option><option value="priority">Prioridade</option></select>'
          +'<button class="icon-toggle sortdir" id="sortDirBtn" type="button"></button></div>'
        +'<div class="tool-right">'
          +'<button class="btn-ghost sm" id="pend" aria-pressed="false">'+svg(IC.check,14)+' Falta pagar</button>'
          +'<button class="btn-wine" id="add">'+svg(IC.plus,15)+' Adicionar</button>'
        +'</div>'
        +'<input type="file" id="impfile" accept="application/json,.json" style="display:none">'
      +'</div>'
      +'<div class="tagbar" id="tagbar"></div>'
      +'<div class="table-wrap" id="tw"></div>'
      +'<div class="week" id="mes"></div>'
      +'<div class="cartoes" id="cartoes"></div>'
      +'<div class="abast" id="abast"></div>'
      +'<div class="tcc" id="metasEl"></div>'
      +'<footer class="foot" id="foot"></footer>';

    hero=document.getElementById('hero');
    catsEl=document.getElementById('cats');
    panel=document.getElementById('panel');
    toolbar=document.getElementById('toolbar');
    tagbar=document.getElementById('tagbar');
    tw=document.getElementById('tw');
    mesEl=document.getElementById('mes');
    cartoesEl=document.getElementById('cartoes');
    abastEl=document.getElementById('abast');
    metasEl=document.getElementById('metasEl');
    metasEl.addEventListener('click', metasActions);
    metasEl.addEventListener('keydown', function(e){
      if(e.key!=='Enter' && e.key!==' ') return;
      var alvo=e.target.closest('.gcell-l[data-act]'); if(!alvo) return;
      e.preventDefault(); alvo.click();
    });
    foot=document.getElementById('foot');
    searchInput=document.getElementById('q');
    /* O input ocupa 18px dentro de uma moldura de 40px: sem isto, tocar na
       moldura não fazia nada e parecia que a busca estava travada. */
    var searchWrap=document.getElementById('searchWrap');
    if(searchWrap) searchWrap.addEventListener('click', function(e){
      if(e.target===searchWrap || e.target.tagName==='SPAN' || e.target.tagName==='svg') searchInput.focus();
    });
    clearX=document.getElementById('clearx');
    importFile=document.getElementById('impfile');
    themeBtn=document.getElementById('theme');

    searchInput.addEventListener('input', function(){
      query=searchInput.value; clearX.style.display=query?'':'none';
      if(searchTimer) clearTimeout(searchTimer);
      searchTimer=setTimeout(function(){ searchTimer=null; renderTable(); }, 120);
    });
    clearX.addEventListener('click', clearSearch);
    document.getElementById('sortSel').addEventListener('change', function(){
      sortKey=this.value; sortDir='asc'; saveUI(); renderSortDir(); renderTable();
    });
    /* no celular não existe cabeçalho de tabela para clicar: sem este botão a
       ordem invertida só podia ser escolhida no PC. */
    document.getElementById('sortDirBtn').addEventListener('click', function(){
      sortDir = (sortDir==='asc'?'desc':'asc'); saveUI(); renderSortDir(); renderTable();
      anunciar(sortDir==='asc'?'Ordem crescente':'Ordem decrescente');
    });
    themeBtn.addEventListener('click', function(){ dark=!dark; saveUI(); renderAll(); });
    document.getElementById('vswitch').addEventListener('click', function(e){
      var b=e.target.closest('[data-v]'); if(!b) return;
      view=b.getAttribute('data-v'); openMenuId=null;
      saveUI(); applyView(); renderMain();
    });
    document.getElementById('pend').addEventListener('click', function(){
      soPendentes=!soPendentes; saveUI(); renderPendBtn(); renderTagbar(); renderTable();
      anunciar(soPendentes?'Mostrando só o que falta pagar':'Mostrando tudo');
    });
    document.getElementById('add').addEventListener('click', novoLanc);
    document.getElementById('fileBtn').addEventListener('click', abrirModalArquivo);
    document.getElementById('prefsBtn').addEventListener('click', abrirPreferencias);
    document.getElementById('helpBtn').addEventListener('click', abrirAjuda);
    importFile.addEventListener('change', function(){ if(importFile.files && importFile.files[0]){ doImport(importFile.files[0]); importFile.value=''; } });

    /* O rodapé é reescrito por três funções diferentes; um só ouvinte no
       elemento pai cobre todas sem cada uma ter de religar o botão. */
    foot.addEventListener('click', function(e){
      var b=e.target.closest('[data-act="bkp-rodape"]'); if(!b) return;
      doExport();
    });
    document.getElementById('lembrete').addEventListener('click', function(e){
      var b=e.target.closest('[data-act]'); if(!b) return;
      var act=b.getAttribute('data-act');
      if(act==='bkp-agora'){ doExport(); return; }
      if(act==='bkp-depois'){ lembreteAdiado=nowISO(); saveUI(); renderLembrete(); renderFileBtn();
        anunciar('Lembrete adiado por duas semanas'); return; }
    });
    document.getElementById('instalar').addEventListener('click', function(e){
      if(!e.target.closest('[data-act="inst-nao"]')) return;
      marcarInstalar('nao'); renderInstalar();
    });
    catsEl.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act');
      if(act==='pick'){ catAtualId=el.getAttribute('data-id'); query=''; fTag=''; tetoAberto=false;
        searchInput.value=''; clearX.style.display='none'; openMenuId=null; renderAll(); return; }
      if(act==='addcat'){ openCatModal(null); return; }
    });

    panel.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
      if(act==='editcat'){ var s=findCat(id); if(s) openCatModal(s); return; }
      if(act==='toggleteto'){ tetoAberto=!tetoAberto; renderPanel(); return; }
      if(act==='addavulso'){
        var card=el.closest('.subj-head');
        var dt=card?card.querySelector('[data-fdate]'):null;
        var vl=card?card.querySelector('[data-fval]'):null;
        var ob=card?card.querySelector('[data-fobs]'):null;
        addAvulso(el.getAttribute('data-sid'), dt?dt.value:'', vl?vl.value:'', ob?ob.value:'');
        return;
      }
      if(act==='delavulso'){ delAvulso(el.getAttribute('data-sid'), el.getAttribute('data-d'), el.getAttribute('data-v')); return; }
    });

    tagbar.addEventListener('click', function(e){
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act');
      if(act==='tagf'){ var t=el.getAttribute('data-t'); fTag=(fTag===t?'':t); renderTagbar(); renderTable(); return; }
      if(act==='tagclear'){ fTag=''; renderTagbar(); renderTable(); return; }
    });

    function rowActions(e){
      if(e.target.closest('[data-stop]')) return;
      var el=e.target.closest('[data-act]'); if(!el) return;
      var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
      if(act==='sort'){ var k=el.getAttribute('data-k');
        if(sortKey===k) sortDir=(sortDir==='asc'?'desc':'asc'); else { sortKey=k; sortDir='asc'; }
        var sel=document.getElementById('sortSel'); if(sel) sel.value=sortKey;
        renderSortDir();
        openMenuId=null; renderTable(); return; }
      if(act==='bv-cat'){ openCatModal(null); return; }
      if(act==='bv-importar'){ importFile.click(); return; }
      if(act==='bv-exemplo'){ carregarExemplo(); return; }
      if(act==='ir-vencidas'){
        var alvoV=document.querySelector('.vencidas-alvo');
        if(alvoV){ alvoV.scrollIntoView({behavior:'smooth', block:'start'}); anunciar('Contas vencidas'); }
        return;
      }
      if(act==='ircat'){
        /* Muda de categoria SEM limpar a busca: quem clicou quer ver
           justamente aqueles resultados, não recomeçar a procura. */
        var alvo=e.target.closest('[data-act="ircat"]').getAttribute('data-id');
        if(findCat(alvo)){ catAtualId=alvo; fTag=''; saveUI(); renderAll(); anunciar('Categoria: '+findCat(alvo).name); }
        return;
      }
      if(act==='clearsearch'){ soPendentes=false; saveUI(); renderPendBtn(); clearSearch(); return; }
      if(act==='verpend'){ soPendentes=false; saveUI(); renderPendBtn(); renderTable(); return; }
      if(act==='pedit'){ e.stopPropagation(); e.preventDefault(); abrirEdicaoPago(el); return; }
      if(act==='tagf'){ e.stopPropagation(); var g=el.getAttribute('data-t'); fTag=(fTag===g?'':g); renderTagbar(); renderTable(); return; }
      if(act==='edit'){ var t=findLanc(id); if(t) openLancModal(t); return; }
      if(act==='edit-cat'){ var cc=findCat(id); if(cc) openCatModal(cc); return; }
      if(act==='add-fatura'){ openLancModal(null, id); return; }
      if(act==='novo-cartao'){ novoCartao(); return; }
      if(act==='novo-combustivel'){ novoCombustivel(); return; }
      if(act==='adiar'){ e.stopPropagation(); var ta=findLanc(id); if(ta && ta.venc) openAdiarModal(ta); return; }
      if(act==='abrircard'){ var tc=findLanc(id); if(tc) openLancModal(tc); return; }
      if(act==='mes-'){ e.stopPropagation(); mesOff--; renderMes(); return; }
      if(act==='mes+'){ e.stopPropagation(); mesOff++; renderMes(); return; }
      if(act==='mes0'){ e.stopPropagation(); mesOff=0; renderMes(); return; }
      if(act==='pill'){ e.stopPropagation();
        menuPorTeclado = (e.detail===0);          // clique sintético do Enter/Espaço
        openMenuId=(openMenuId===id?null:id); renderMain(); return; }
      if(act==='setstatus'){ e.stopPropagation();
        aplicarStatus(findLanc(id), el.getAttribute('data-s'));
        openMenuId=null; persist(); renderAll(); return; }
    }
    tw.addEventListener('click', rowActions);
    mesEl.addEventListener('click', rowActions);
    cartoesEl.addEventListener('click', rowActions);
    /* Abastecimento tem seus próprios botões (registrar, remover, ir para o
       porquinho); reaproveita addAvulso/delAvulso da mecânica de avulsos. */
    abastEl.addEventListener('click', function(e){
      var b=e.target.closest('[data-act]'); if(!b) return;
      var act=b.getAttribute('data-act');
      if(act==='addavulso'){ addAbastecimento(b.getAttribute('data-sid')); return; }
      if(act==='delavulso'){ delAvulso(b.getAttribute('data-sid'), b.getAttribute('data-d'), +b.getAttribute('data-v')); return; }
      if(act==='ir-porquinho'){ view='metas'; saveUI(); applyView(); renderMain(); return; }
      if(act==='edit-teto'){ var c=findCat(b.getAttribute('data-sid')); if(c) openCatModal(c); return; }
      if(act==='novo-combustivel'){ novoCombustivel(); return; }
    });

    document.addEventListener('click', function(){
      var changed=false;
      if(openMenuId!==null){ openMenuId=null; changed=true; }
      if(changed) renderMain();
    });

    document.addEventListener('keydown', function(e){
      if(e.key==='Escape'){
        if(modalOpen()){ closeModal(); return; }
        var changed=false;
        if(openMenuId!==null){ openMenuId=null; changed=true; }
        if(changed) renderMain();
        return;
      }
      if(modalOpen()) return;
      var tag=(e.target && e.target.tagName)||'';
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
      if(e.ctrlKey||e.metaKey||e.altKey) return;
      if(e.key==='n'){ e.preventDefault();
        if(view==='metas'){ openMarcoModal(null); return; }
        if(view==='abast'){ novoAbastecimento(); return; }
        novoLanc(); return; }
      // "p" abre e fecha o porquinho — fica fora do rodízio da tecla "s"
      if(e.key==='p' || e.key==='r'){ e.preventDefault();
        openMenuId=null;
        view = (view==='metas') ? 'mes' : 'metas';
        saveUI(); applyView(); renderMain(); return; }
      if(e.key==='s'){ e.preventDefault();
        openMenuId=null;
        /* "s" roda entre as três abas do dia a dia; o porquinho tem a sua
           própria tecla e não entra no rodízio. */
        var ordem=['mes','cartoes','abast'];
        var i=ordem.indexOf(view);
        view = (i<0) ? 'mes' : ordem[(i+1)%ordem.length];
        saveUI(); applyView(); renderMain(); return; }
    });

    /* Trocar innerHTML muda a altura da página e o navegador dispara um
       "scroll" que NÃO veio da pessoa. Fechar o menu nesse evento fazia ele
       nunca abrir. Só fecha se a página realmente se moveu. */
    window.addEventListener('scroll', function(){
      if(openMenuId===null) return;
      if(Math.abs(window.pageYOffset-menuScroll.y)<2 && Math.abs(window.pageXOffset-menuScroll.x)<2) return;
      openMenuId=null; renderStatusMenu();
    }, true);
    window.addEventListener('resize', function(){
      if(openMenuId!==null){ openMenuId=null; renderStatusMenu(); }
      if(isNarrow()!==narrow){ narrow=isNarrow(); applyView(); renderMain(); }
    });

    // Só preferências de tela: os dados já são salvos a cada alteração.
    window.addEventListener('beforeunload', function(){ try{ saveUI(); }catch(e){} });
    /* pagehide cobre o celular (fechar o app, trocar de aba), onde beforeunload
       muitas vezes nem dispara. */
    window.addEventListener('pagehide', function(){ try{ saveUI(); descarregarPendencias(); }catch(e){} });
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState==='hidden'){ try{ saveUI(); descarregarPendencias(); }catch(e){} }
    });

    narrow=isNarrow();
    contarVisita();
    ouvirOutrasAbas();
    load();
    loadUI();
    loadSync();
    retomarArquivo();
    ajustarCategoriaAtual();
    searchInput.value=query;
    renderAll();
    syncAoAbrir();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();
</script>
