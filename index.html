    var pr=parseMoeda(a.preco), lt=parseMoeda(a.litros);
    return { d: isoOk(a.d)?a.d:'', v: (v==null||v<0)?0:Math.min(v,9999999),
             o: txtSeguro(a.o,60),
             preco: (pr==null||pr<0)?null:Math.min(pr,99999),
             litros:(lt==null||lt<0)?null:Math.min(lt,99999) };
  }
  function normCategoria(s){
    var o=Object.assign({id:"",name:"",instituicao:"",color:PALETTE[0],teto:0,avulsos:[],
      link:"",meta:false,diaVenc:0,obs:"",tipo:""}, ehObjeto(s)?s:null);
    o.name=txtSeguro(o.name,120); o.instituicao=txtSeguro(o.instituicao,120);
    o.link=txtSeguro(o.link,2000);
    o.obs=txtSeguro(o.obs,300);
    o.diaVenc=diaVencSeguro(o.diaVenc);
    o.meta=!!o.meta;
    /* O tipo decide em qual aba a categoria mora: 'cartao' vai para Cartões,
       'combustivel' para Abastecimento. Vazio = categoria comum, aparece só
       no Mês. Qualquer outro valor é tratado como vazio. */
    o.tipo = (o.tipo==='cartao' || o.tipo==='combustivel') ? o.tipo : '';
    o.id=idSeguro(o.id,'cat');
    o.color=corSegura(o.color, PALETTE[0]);
    var teto=parseMoeda(o.teto);
    o.teto = (teto==null||teto<0) ? 0 : Math.min(teto, 9999999);
    if(!Array.isArray(o.avulsos)) o.avulsos=[];
    o.avulsos=o.avulsos.map(normAvulso).filter(function(a){ return !!a.d; }).slice(0,600);
    return o;
  }
  function normLanc(t){
    var o=Object.assign({id:"",catId:"",parcela:null,name:"",descricao:"",onde:"",venc:"",
      link:"",color:"",status:"pendente",notes:"",valor:null,pago:null,priority:"normal",tags:[],
      kind:"despesa",entType:"outro"}, ehObjeto(t)?t:null);
    o.name=txtSeguro(o.name,300); o.descricao=txtSeguro(o.descricao,300);
    o.onde=txtSeguro(o.onde,200); o.notes=txtSeguro(o.notes,1000);
    o.link=txtSeguro(o.link,2000);
    o.kind = (o.kind==='entrada') ? 'entrada' : 'despesa';
    if(!temValor(ENT_TIPO, o.entType)) o.entType='outro';
    o.id=idSeguro(o.id,'l');
    o.color=corSegura(o.color);           // vazio = herda a cor da categoria
    if(!isoOk(o.venc)) o.venc='';
    if(!temValor(STATUS, o.status)) o.status='pendente';
    if(!temValor(PRIO, o.priority)) o.priority='normal';
    o.parcela=num(o.parcela);
    if(o.parcela!=null && o.parcela<0) o.parcela=null;      // o "min=0" do formulário não era respeitado
    o.valor=parseMoeda(o.valor);
    if(o.valor!=null && o.valor<0) o.valor=null;
    o.pago=parseMoeda(o.pago);
    if(o.pago!=null && o.pago<0) o.pago=null;
    if(o.pago!=null && o.valor!=null && o.pago>o.valor) o.pago=o.valor;
    if(!Array.isArray(o.tags)) o.tags = o.tags? String(o.tags).split(',').map(function(x){return x.trim();}).filter(Boolean) : [];
    o.tags = o.tags.map(function(x){ return txtSeguro(x,40); }).filter(Boolean).slice(0,20);
    return o;
  }
  function normMarco(e){
    var o=Object.assign({id:"",name:"",start:"",end:"",status:"todo",notes:"",valor:null}, ehObjeto(e)?e:null);
    o.id=idSeguro(o.id,'mc');
    o.name=txtSeguro(o.name,200); o.notes=txtSeguro(o.notes,1000);
    if(!temValor(ETAPA, o.status)) o.status='todo';
    if(!isoOk(o.start)) o.start='';
    if(!isoOk(o.end)) o.end='';
    if(o.start && o.end && o.end < o.start) o.end=o.start;
    o.valor=parseMoeda(o.valor);
    if(o.valor!=null && o.valor<0) o.valor=null;
    return o;
  }
  function normConf(o0){
    var o=Object.assign({id:"",date:"",saldo:null,obs:""}, ehObjeto(o0)?o0:null);
    o.id=idSeguro(o.id,'cf');
    o.obs=txtSeguro(o.obs,1000);
    if(!isoOk(o.date)) o.date='';
    o.saldo=parseMoeda(o.saldo);
    return o;
  }
  /* Um mês arquivado é uma cópia completa e independente: categorias,
     lançamentos e a aba de reservas. Passa pela mesma normalização do conteúdo
     vivo, porque ele volta a ser conteúdo vivo quando for restaurado. */
  function normArquivo(a){
    a=(a && typeof a==='object') ? a : {};
    var d=normalizarTudo(Array.isArray(a.categorias)?a.categorias:[], Array.isArray(a.lancamentos)?a.lancamentos:[]);
    var em=String(a.em==null?'':a.em);
    return { id: idSeguro(a.id,'arq'),
             nome: (String(a.nome==null?'':a.nome).trim().slice(0,60)) || 'Período',
             em: /^\d{4}-\d{2}-\d{2}$/.test(em.slice(0,10)) ? em.slice(0,10) : todayISO(),
             categorias: d.categorias, lancamentos: d.lancamentos, metas: normMetas(a.metas) };
  }
  /* Teto alto, só para um arquivo corrompido não travar o navegador. Quando
     corta, avisa — silenciar isso fazia períodos sumirem sem explicação. */
  function normArquivos(v){
    if(!Array.isArray(v)) return [];
    var TETO=200;
    if(v.length>TETO){
      try{ alert('Este backup traz '+v.length+' períodos guardados e o app aceita '+TETO+'.\n\nOs '+(v.length-TETO)+' mais antigos foram descartados.'); }catch(e){}
    }
    return v.slice(0,TETO).map(normArquivo);
  }
  /* Ponto único por onde tudo entra: aqui os ids ficam únicos e todo lançamento
     sai apontando para uma categoria que existe. */
  function normalizarTudo(rawCats, rawLancs){
    var mapa={}, usados={}, origVistos={};
    var temCat=function(k){
      return typeof k==='string' && Object.prototype.hasOwnProperty.call(usados,k); };
    var jaViu=function(k){
      return typeof k==='string' && Object.prototype.hasOwnProperty.call(origVistos,k); };
    /* Uma string, um número ou um null no meio da lista viravam categorias sem
       nome na faixa (e a string ainda gravava as propriedades 0…n dela). */
    var cats=(Array.isArray(rawCats)?rawCats:[]).filter(ehObjeto).map(function(x){
      var antes=(x&&x.id)!=null?String(x.id):'';
      var repetido=jaViu(antes);
      if(antes) origVistos[antes]=1;
      var s2=normCategoria(x);
      /* Dois ids iguais faziam o lápis de uma linha abrir a outra e o botão de
         apagar levar as duas. O segundo ganha um id novo. */
      if(temCat(s2.id)) s2.id=uid('cat');
      usados[s2.id]=1;
      /* Só a PRIMEIRA categoria com um id original manda nesse id: os
         lançamentos que apontam para ele são dela. */
      if(antes && antes!==s2.id && !repetido) mapa[antes]=s2.id;
      return s2;
    });
    var idsL={}, temL=function(k){
      return typeof k==='string' && Object.prototype.hasOwnProperty.call(idsL,k); };
    var primeira = cats.length ? cats[0].id : '';
    var lncs=(Array.isArray(rawLancs)?rawLancs:[]).filter(ehObjeto).map(function(x){
      var t2=normLanc(x);
      if(temL(t2.id)) t2.id=uid('l');
      idsL[t2.id]=1;
      /* mapa["toString"] devolvia a função herdada do protótipo e o catId
         virava uma função — que o JSON.stringify seguinte descartava. */
      if(Object.prototype.hasOwnProperty.call(mapa, t2.catId)) t2.catId=mapa[t2.catId];
      /* Lançamento apontando para uma categoria que não existe ficava contado no
         topo da página e inalcançável em qualquer tela. Vai para a primeira
         categoria, onde dá para ver, mover ou apagar. */
      if(!temCat(t2.catId)) t2.catId=primeira;
      return t2;
    }).filter(function(t){ return !!t.catId; });
    return {categorias:cats, lancamentos:lncs};
  }
  function metasRecebidas(obj, atual){
    if(obj && Object.prototype.hasOwnProperty.call(obj,'metas')) return normMetas(obj.metas);
    return atual || normMetas(null);
  }
  /* Uma chave "lancamentos" ausente significa "não sei", não "apague tudo". Um
     gist editado à mão ou uma gravação parcial não podem zerar as contas de
     todos os aparelhos. */
  function temChave(obj, k){ return !!obj && Object.prototype.hasOwnProperty.call(obj,k) && Array.isArray(obj[k]); }
  function normMetas(t){
    var o=Object.assign({titulo:"",instituicao:"",objetivo:null,prazo:"",prazoLabel:"Data-alvo",link:"",
      marcos:[], conferencias:[]}, ehObjeto(t)?t:null);
    o.titulo=txtSeguro(o.titulo,300); o.instituicao=txtSeguro(o.instituicao,120);
    o.prazoLabel=txtSeguro(o.prazoLabel,60); o.link=txtSeguro(o.link,2000);
    if(!isoOk(o.prazo)) o.prazo='';
    if(!o.prazoLabel) o.prazoLabel='Data-alvo';
    o.objetivo=parseMoeda(o.objetivo);
    if(o.objetivo!=null && o.objetivo<0) o.objetivo=null;
    o.marcos = Array.isArray(o.marcos) ? o.marcos.map(normMarco) : [];
    o.conferencias = Array.isArray(o.conferencias) ? o.conferencias.map(normConf) : [];
    return o;
  }
  /* Só o formato deixava passar 2026-02-31 e 0000-00-00: o Date transbordava
     para 03/03 e a tela mostrava uma data que não era a usada nas contas. */
  function isoOk(d){
    d=String(d==null?'':d);
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d); if(!m) return false;
    var a=+m[1], mes=+m[2], dia=+m[3];
    if(a<1900 || a>2200 || mes<1 || mes>12 || dia<1 || dia>31) return false;
    var dt=new Date(a, mes-1, dia);
    return dt.getFullYear()===a && dt.getMonth()===mes-1 && dt.getDate()===dia;
  }

  // ---- sincronização entre aparelhos (GitHub Gist) ----
  var SYNC_KEY='organizador-contas:sync';
  var GIST_FILE='organizador-contas.json';
  function gistDesc(){ return appCfg.titulo+' — dados sincronizados'; }
  var syncToken='', gistId='', lastSyncedAt='', dataUpdatedAt='';
  var syncState='off';   // off | on | conflito | erro
  var syncMsg='', syncBusy=false, syncTimer=null, syncAt='';

  function nowISO(){ return new Date().toISOString(); }
  function loadSync(){
    try{ var o=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}');
      syncToken=o.token||''; gistId=o.gist||''; lastSyncedAt=o.at||''; syncAt=o.when||'';
    }catch(e){}
    if(syncToken && gistId) syncState='on';
  }
  function saveSync(){
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify({token:syncToken, gist:gistId, at:lastSyncedAt, when:syncAt})); }catch(e){}
  }
  /* O token fica só aqui, nunca entra no Exportar nem no arquivo local. */
  function esqueceSync(){
    syncToken=''; gistId=''; lastSyncedAt=''; syncAt=''; syncState='off'; syncMsg='';
    try{ localStorage.removeItem(SYNC_KEY); }catch(e){}
  }

  function gh(caminho, opts){
    opts=opts||{};
    var req={ method:opts.method||'GET',
      headers:{ 'Authorization':'Bearer '+syncToken,
                'Accept':'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28' } };
    if(opts.body){ req.body=JSON.stringify(opts.body); req.headers['Content-Type']='application/json'; }
    return fetch('https://api.github.com'+caminho, req).then(function(r){
      if(r.status===401) throw new Error('Token inválido ou expirado. Gere um novo no GitHub.');
      if(r.status===403) throw new Error('O GitHub recusou (limite de uso ou permissão faltando).');
      if(r.status===404) throw new Error('O arquivo de sincronização não foi encontrado na sua conta.');
      if(!r.ok) throw new Error('O GitHub respondeu com erro '+r.status+'.');
      return r.json();
    });
  }
  function conteudoDoGist(g){
    var f=g && g.files && g.files[GIST_FILE];
    if(!f || typeof f.content!=='string') return null;
    try{ return JSON.parse(f.content); }catch(e){ return null; }
  }
  function corpoDoGist(){
    var files={}; files[GIST_FILE]={content:JSON.stringify(payload(),null,2)};
    return {description:gistDesc(), files:files};
  }
  /* Um payload completo tem as duas listas. VAZIAS é um estado legítimo: é
     exatamente como fica o aparelho que acabou de fechar o mês. Exigir
     categorias fazia o outro aparelho recusar essa atualização para sempre. */
  function payloadCompleto(obj){
    return !!obj && typeof obj==='object' && temChave(obj,'categorias') && temChave(obj,'lancamentos');
  }
  function aplicarRemoto(obj){
    if(!payloadCompleto(obj)) return false;
    var d=normalizarTudo(obj.categorias, obj.lancamentos);
    categorias=d.categorias; lancamentos=d.lancamentos;
    metas=metasRecebidas(obj, metas);
    /* A nuvem manda nas duas chaves novas também. Sem isto, o aparelho que
       baixava ficava com a configuração e os períodos arquivados dele e, no
       primeiro envio, gravava esse vazio por cima do que estava na nuvem. */
    if(obj.cfg && typeof obj.cfg==='object' && !Array.isArray(obj.cfg)){ appCfg=normCfg(obj.cfg); aplicarCfgNaPagina(); }
    if(Array.isArray(obj.arquivos)) arquivos=normArquivos(obj.arquivos);
    dataUpdatedAt=obj.updatedAt||nowISO();
    ajustarCategoriaAtual();
    persist({noStamp:true, noSync:true});
    lastSyncedAt=dataUpdatedAt; syncAt=nowISO(); saveSync();
    return true;
  }
  function syncFalhou(e){
    syncState='erro'; syncMsg=(e&&e.message)||'Falha ao sincronizar.'; syncBusy=false;
    renderFileBtn();
  }

  function syncEnviar(forcar){
    if(syncState==='off' || !syncToken || !gistId) return Promise.resolve();
    syncBusy=true; renderFileBtn();
    return gh('/gists/'+gistId).then(function(g){
      var remoto=conteudoDoGist(g);
      var remotoAt=(remoto&&remoto.updatedAt)||'';
      /* Sem lastSyncedAt não dá para saber se a nuvem mudou — antes isso
         DESLIGAVA a checagem e o envio sobrescrevia tudo em silêncio. Agora o
         desconhecido também vira conflito. */
      var desconhecido = !lastSyncedAt && remotoAt && remotoAt!==dataUpdatedAt;
      if(!forcar && remotoAt && (desconhecido || (lastSyncedAt && remotoAt!==lastSyncedAt))){
        syncState='conflito'; syncBusy=false;
        syncMsg='Este aparelho e a nuvem têm versões diferentes.';
        renderFileBtn();
        return;
      }
      return gh('/gists/'+gistId, {method:'PATCH', body:corpoDoGist()}).then(function(){
        lastSyncedAt=dataUpdatedAt; syncAt=nowISO(); saveSync();
        syncState='on'; syncMsg=''; syncBusy=false; renderFileBtn();
      });
    }).catch(syncFalhou);
  }
  function syncBaixar(){
    if(!syncToken || !gistId) return Promise.resolve();
    syncBusy=true; renderFileBtn();
    return gh('/gists/'+gistId).then(function(g){
      var remoto=conteudoDoGist(g);
      if(!remoto) throw new Error('A cópia na nuvem está vazia ou ilegível.');
      if(!aplicarRemoto(remoto)) throw new Error('A cópia na nuvem está incompleta (faltam categorias ou lançamentos) — nada foi baixado.');
      syncState='on'; syncMsg=''; syncBusy=false;
      closeModal(); renderAll();
    }).catch(syncFalhou);
  }
  function agendarSync(){
    if(syncState!=='on') return;
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer=setTimeout(function(){ syncTimer=null; syncEnviar(false); }, 2500);
  }
  /* Ao abrir: se só a nuvem mudou, baixa; se só este aparelho mudou, envia;
     se os dois mudaram, para e pergunta. */
  function syncAoAbrir(){
    if(syncState!=='on' || !syncToken || !gistId) return;
    syncBusy=true; renderFileBtn();
    gh('/gists/'+gistId).then(function(g){
      var remoto=conteudoDoGist(g);
      var remotoAt=(remoto&&remoto.updatedAt)||'';
      var localMudou = dataUpdatedAt && lastSyncedAt && dataUpdatedAt!==lastSyncedAt;
      var remotoMudou = remotoAt && lastSyncedAt && remotoAt!==lastSyncedAt;
      syncBusy=false;
      if(remotoMudou && localMudou){
        syncState='conflito'; syncMsg='Este aparelho e a nuvem têm versões diferentes.';
        renderFileBtn(); return;
      }
      if(remotoMudou || (!lastSyncedAt && remotoAt)){
        if(aplicarRemoto(remoto)){ renderAll(); return; }
        /* Recusar a cópia da nuvem e ainda assim carimbar "Sincronizado" deixava
           o aparelho em conflito permanente jurando que estava em dia. */
        syncState='erro'; syncMsg='A cópia na nuvem está incompleta — nada foi baixado.';
        renderFileBtn(); return;
      }
      if(localMudou) return syncEnviar(false);
      syncAt=nowISO(); saveSync(); renderFileBtn();
    }).catch(syncFalhou);
  }
  /* Conectar: acha um gist já existente desta conta (assim o 2º aparelho
     entra sozinho) ou cria um novo com o que há neste aparelho. */
  function syncConectar(token){
    token=(token||'').trim();
    if(!token){ alert('Cole o token do GitHub para conectar.'); return; }
    syncToken=token; syncBusy=true; syncMsg=''; renderFileBtn();
    return gh('/gists?per_page=100').then(function(lista){
      var achado=null;
      (lista||[]).forEach(function(g){
        if(!achado && g.files && g.files[GIST_FILE]) achado=g;
      });
      if(achado){
        /* Conectar o segundo aparelho baixa a nuvem por cima do que está aqui.
           Quando há conteúdo local diferente, isso é uma troca destrutiva como
           qualquer outra: pergunta, e guarda um backup antes. */
        var remoto=conteudoDoGist(achado);
        if(payloadCompleto(remoto) && temConteudoVivo() && conteudoDiferente(remoto)){
          if(!confirmarTroca(remoto)){
            syncToken=''; syncBusy=false; syncState='off'; renderFileBtn();
            return;
          }
          downloadJson(payload(), 'backup-antes-de-conectar-'+stamp()+'.json');
        }
        gistId=achado.id; lastSyncedAt=''; syncState='on'; saveSync();
        return syncBaixar().then(function(){
          if(syncState==='on') toastSync('Conectado. Dados baixados da nuvem.');
        });
      }
      return gh('/gists', {method:'POST', body:Object.assign({public:false}, corpoDoGist())})
        .then(function(g){
          gistId=g.id; lastSyncedAt=dataUpdatedAt; syncAt=nowISO();
          syncState='on'; syncBusy=false; saveSync();
          closeModal(); renderAll();
          toastSync('Conectado. Este aparelho virou a cópia principal.');
        });
    }).catch(function(e){
      syncToken=''; gistId=''; syncState='off';
      syncBusy=false; syncMsg=(e&&e.message)||'Falha ao conectar.';
      renderFileBtn();
      alert('Não consegui conectar: '+syncMsg);
    });
  }
  function toastSync(msg){ syncMsg=msg; renderFileBtn(); }

  // ---- arquivo único (File System Access API) ----
  var fileHandle=null, fileName='', fileState='off';  // off | on | precisa | nao_suportado
  var fileTimer=null, fileErr='';
  var IDB_DB='organizador-contas', IDB_STORE='fs', IDB_KEY='handle';

  function fsSuportado(){ return typeof window.showSaveFilePicker==='function'; }
  function idbOpen(){
    return new Promise(function(res,rej){
      if(!window.indexedDB) return rej(new Error('sem indexedDB'));
      var r=indexedDB.open(IDB_DB,1);
      r.onupgradeneeded=function(){ r.result.createObjectStore(IDB_STORE); };
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ rej(r.error); };
    });
  }
  function idbPut(v){
    return idbOpen().then(function(db){ return new Promise(function(res,rej){
      var tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(v, IDB_KEY);
      tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); };
    }); });
  }
  function idbGet(){
    return idbOpen().then(function(db){ return new Promise(function(res,rej){
      var tx=db.transaction(IDB_STORE,'readonly');
      var q=tx.objectStore(IDB_STORE).get(IDB_KEY);
      q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); };
    }); });
  }
  function payload(){ return {versao:1, updatedAt:dataUpdatedAt, cfg:appCfg, categorias:categorias, lancamentos:lancamentos, metas:metas, arquivos:arquivos}; }

  function escreverArquivo(){
    if(fileState!=='on' || !fileHandle) return Promise.resolve();
    return fileHandle.createWritable().then(function(w){
      return w.write(JSON.stringify(payload(),null,2)).then(function(){ return w.close(); });
    }).then(function(){
      if(fileErr){ fileErr=''; renderFileBtn(); }
    }).catch(function(e){
      fileErr=e && e.message ? e.message : 'falha ao gravar';
      fileState='precisa'; renderFileBtn();
    });
  }
  function agendarEscrita(){
    if(fileState!=='on') return;
    if(fileTimer) clearTimeout(fileTimer);
    fileTimer=setTimeout(function(){ fileTimer=null; escreverArquivo(); }, 400);
  }
  /* Duas abas do app abertas gravavam por cima uma da outra: a última a salvar
     vencia e o que a outra tinha escrito sumia, inclusive depois de recarregar.
     Agora esta aba escuta a vizinha e se atualiza quando a gravação de lá for
     mais nova do que a daqui. */
  function ouvirOutrasAbas(){
    window.addEventListener('storage', function(e){
      if(!e || e.key!==STORAGE_KEY || !e.newValue) return;
      var obj=null; try{ obj=JSON.parse(e.newValue); }catch(err){ return; }
      if(!payloadCompleto(obj)) return;
      if(obj.updatedAt && dataUpdatedAt && obj.updatedAt<=dataUpdatedAt) return;
      // aplica sem recarimbar e sem reenviar: o dado veio de dentro do navegador
      var d=normalizarTudo(obj.categorias, obj.lancamentos);
      categorias=d.categorias; lancamentos=d.lancamentos;
      metas=metasRecebidas(obj, metas);
      if(obj.cfg && typeof obj.cfg==='object' && !Array.isArray(obj.cfg)){ appCfg=normCfg(obj.cfg); aplicarCfgNaPagina(); }
      if(Array.isArray(obj.arquivos)) arquivos=normArquivos(obj.arquivos);
      dataUpdatedAt=obj.updatedAt||dataUpdatedAt;
      ajustarCategoriaAtual();
      closeModal();
      renderAll();
      anunciar('Atualizado com o que foi alterado em outra aba');
    });
  }
  /* Fechar a aba com uma escrita ainda na fila deixava o arquivo e a nuvem
     atrás do navegador. Ao esconder a página, descarrega o que estiver pendente. */
  function descarregarPendencias(){
    if(fileTimer){ clearTimeout(fileTimer); fileTimer=null; try{ escreverArquivo(); }catch(e){} }
    if(syncTimer){ clearTimeout(syncTimer); syncTimer=null; try{ syncEnviar(false); }catch(e){} }
  }
  function assinatura(o){
    try{ return JSON.stringify({s:o.categorias, t:o.lancamentos, m:o.metas, g:normCfg(o.cfg), a:o.arquivos||[]}); }catch(e){ return ''; }
  }
  function conteudoDiferente(obj){
    return assinatura(obj) !== assinatura({categorias:categorias, lancamentos:lancamentos, metas:metas, cfg:appCfg, arquivos:arquivos});
  }
  /* Trocar os dados vivos pelos de um arquivo é destrutivo: se o arquivo for
     mais antigo, some trabalho. Perguntar, mostrando as duas datas. */
  function confirmarTroca(obj){
    var doArquivo=obj.updatedAt||'', daMemoria=dataUpdatedAt||'';
    var quando=function(x){
      if(!x) return 'data desconhecida';
      var d=new Date(x); if(isNaN(d.getTime())) return 'data desconhecida';
      return fmtDate(diaLocal(d))+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
    };
    var maisVelho = doArquivo && daMemoria && doArquivo < daMemoria;
    return confirm('Substituir o que está aberto agora pelo conteúdo do arquivo?\n\n'
      +'Neste aparelho: '+quando(daMemoria)+'\n'
      +'No arquivo: '+quando(doArquivo)
      +(maisVelho?'\n\nATENÇÃO: o arquivo é MAIS ANTIGO. Você perde o que fez desde então.':'')
      +'\n\nEsta ação não pode ser desfeita.');
  }
  function aplicarConteudo(obj){
    if(!payloadCompleto(obj)) return false;
    var d=normalizarTudo(obj.categorias, obj.lancamentos);
    categorias=d.categorias; lancamentos=d.lancamentos;
    metas=metasRecebidas(obj, metas);
    /* Backup antigo não tem "cfg". Isso não é "quero o nome padrão", é "não sei
       nada sobre isso" — a configuração daqui fica como está. */
    if(obj.cfg && typeof obj.cfg==='object' && !Array.isArray(obj.cfg)){ appCfg=normCfg(obj.cfg); aplicarCfgNaPagina(); }
    // mesma regra: backup sem a chave não é um pedido para apagar os arquivados
    if(Array.isArray(obj.arquivos)) arquivos=normArquivos(obj.arquivos);
    ajustarCategoriaAtual();
    return true;
  }
  function conectarArquivo(novo){
    if(!fsSuportado()){ abrirModalArquivo(); return; }
    var pedir = novo
      ? window.showSaveFilePicker({ suggestedName:'organizador-contas.json',
          types:[{description:'Dados do organizador', accept:{'application/json':['.json']}}] })
      : window.showOpenFilePicker({ multiple:false,
          types:[{description:'Dados do organizador', accept:{'application/json':['.json']}}] })
          .then(function(a){ return a[0]; });
    return pedir.then(function(h){
      fileHandle=h; fileName=h.name||'arquivo.json'; fileState='on'; fileErr='';
      if(novo) return escreverArquivo();
      return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
        var obj=null; try{ obj=JSON.parse(txt); }catch(e){}
        /* Abrir um arquivo troca tudo o que está na tela. Antes isso acontecia
           no clique, sem uma pergunta — e o arquivo escolhido por engano levava
           o mês inteiro junto. */
        if(payloadCompleto(obj)){
          if(!conteudoDiferente(obj)) { /* igual: nada a trocar */ }
          else if(!confirmarTroca(obj)){
            fileHandle=null; fileName=''; fileState='off';
            return;   // desistiu: não conecta nem grava
          }
          else if(aplicarConteudo(obj)) persist();
        }
        else if(txt && txt.trim() && !confirm('Esse arquivo não tem dados do organizador.\n\nQuer mesmo passar a gravar os dados atuais nele? O conteúdo que estiver lá será substituído.')){
          fileHandle=null; fileName=''; fileState='off';
          return;
        }
        return escreverArquivo();
      });
    }).then(function(){
      return idbPut(fileHandle).catch(function(){});
    }).then(function(){
      closeModal(); renderAll();
    }).catch(function(e){
      if(e && e.name==='AbortError') return;   // a pessoa cancelou o seletor
      alert('Não consegui conectar o arquivo: '+((e&&e.message)||e));
    });
  }
  function desconectarArquivo(){
    fileHandle=null; fileName=''; fileState='off'; fileErr='';
    idbPut(null).catch(function(){});
    closeModal(); renderAll();
  }
  /* Ao abrir, tenta retomar o arquivo já autorizado. O navegador pode exigir
     um clique para reconceder a permissão — daí o estado "precisa". */
  function retomarArquivo(){
    if(!fsSuportado()){ fileState='nao_suportado'; renderFileBtn(); return; }
    idbGet().then(function(h){
      if(!h) return;
      fileHandle=h; fileName=h.name||'arquivo.json';
      if(!h.queryPermission){ fileState='precisa'; renderFileBtn(); return; }
      return h.queryPermission({mode:'readwrite'}).then(function(p){
        if(p!=='granted'){ fileState='precisa'; renderFileBtn(); return; }
        fileState='on';
        return h.getFile().then(function(f){ return f.text(); }).then(function(txt){
          var obj=null; try{ obj=JSON.parse(txt); }catch(e){}
          /* Só reescreve se o arquivo trouxer algo REALMENTE diferente. Antes,
             qualquer abertura recarimbava dataUpdatedAt e inventava conflito
             com a nuvem em todo boot. */
          /* Arquivo MAIS NOVO é o caso normal de quem guarda o .json no Drive e
             abre no outro computador: entra sozinho. Arquivo mais VELHO
             (gravação que falhou, pasta revertida) apagava em silêncio o que só
             existia aqui — esse caso passa a perguntar. */
          if(obj && conteudoDiferente(obj)){
            var doArq=obj.updatedAt||'', daMem=dataUpdatedAt||'';
            /* ">=" e não ">": carimbos iguais com conteúdo diferente querem
               dizer que o .json foi editado por fora desde a última vez que
               ESTE app escreveu — a memória daqui não avançou, então o arquivo
               manda. */
            var maisNovo = doArq && (!daMem || doArq>=daMem);
            if(maisNovo){ if(aplicarConteudo(obj)) persist({noStamp:true}); }
            else if(confirmarTroca(obj)){ if(aplicarConteudo(obj)) persist(); }
            else agendarEscrita();   // ficou com o daqui: manda para o arquivo
          }
          renderAll();
        });
      });
    }).catch(function(){ /* sem arquivo guardado */ });
  }
  function reconectarArquivo(){
    if(!fileHandle || !fileHandle.requestPermission){ conectarArquivo(true); return; }
    fileHandle.requestPermission({mode:'readwrite'}).then(function(p){
      if(p!=='granted'){ alert('Sem permissão para gravar no arquivo.'); return; }
      fileState='on'; fileErr='';
      return fileHandle.getFile().then(function(f){ return f.text(); }).then(function(txt){
        var obj=null; try{ obj=JSON.parse(txt); }catch(e){}
        if(obj && conteudoDiferente(obj) && confirmarTroca(obj) && aplicarConteudo(obj)) persist();
        return escreverArquivo();
      }).then(function(){ closeModal(); renderAll(); });
    }).catch(function(e){ alert('Não consegui reconectar: '+((e&&e.message)||e)); });
  }

  // ---- persistence ----
  function load(){
    var salvo=null;
    try{ var raw=localStorage.getItem(STORAGE_KEY); if(raw) salvo=JSON.parse(raw); }catch(e){}
    /* "Zero categorias" não é "nunca usou o app". Só a AUSÊNCIA de payload
       salvo autoriza semear — senão apagar a última categoria fazia o conteúdo
       inicial ressuscitar por cima de tudo. */
    if(salvo && Array.isArray(salvo.categorias)){
      var d=normalizarTudo(salvo.categorias, salvo.lancamentos);
      categorias=d.categorias; lancamentos=d.lancamentos;
      metas=metasRecebidas(salvo, null);
      appCfg=normCfg(salvo.cfg);
      arquivos=normArquivos(salvo.arquivos);
      dataUpdatedAt=salvo.updatedAt||nowISO();
    } else {
      var seed = (typeof MEUS_DADOS==='function') ? MEUS_DADOS() : {categorias:[], lancamentos:[], metas:null, cfg:null};
      var ds=normalizarTudo(seed.categorias, seed.lancamentos);
      categorias=ds.categorias; lancamentos=ds.lancamentos;
      metas=normMetas(seed.metas);
      appCfg=normCfg(seed.cfg);
      arquivos=[];
      /* Semear NÃO grava: só olhar o app não deve criar um registro salvo,
         senão o backup que a pessoa importa depois disputa "quem é mais
         recente" com algo que ela nunca escreveu. A primeira alteração grava. */
      dataUpdatedAt=nowISO();
    }
    aplicarCfgNaPagina();
  }
  /* A categoria aberta nunca pode ser a da reserva — ela não aparece na faixa. */
  function ajustarCategoriaAtual(){
    var vis=categoriasVis();
    var atual=findCat(catAtualId);
    if(!atual || atual.meta) catAtualId = vis.length ? vis[0].id : null;
  }

  /* opts.noStamp: não mexe no carimbo (usado ao receber dados da nuvem)
     opts.noSync : não agenda envio (evita eco quando o dado VEIO da nuvem) */
  function persist(opts){
    opts=opts||{};
    if(!opts.noStamp) dataUpdatedAt=nowISO();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({updatedAt:dataUpdatedAt, cfg:appCfg, categorias:categorias, lancamentos:lancamentos, metas:metas, arquivos:arquivos}));
      /* Marca de quando a última gravação DEU CERTO. Enquanto ela estiver
         atrás do relógio, o app não pode seguir dizendo "salvo neste navegador". */
      naoSalva=false; storageWarned=false;
      if(avisoSalvar) renderFileBtn();
      avisoSalvar=false;
      agendarEscrita();
      if(!opts.noSync) agendarSync();
    }catch(e){
      agendarEscrita();
      if(!opts.noSync) agendarSync();
      naoSalva=true;
      if(!avisoSalvar){ avisoSalvar=true; renderFileBtn(); }
      /* fileState só vira "precisa" ~400 ms depois, quando a escrita no arquivo
         falha — checar aqui dava um "está tudo bem" que não era verdade. */
      if(!storageWarned){ storageWarned=true;
        alert('⚠️ Não consegui salvar neste navegador. O armazenamento pode estar cheio ou bloqueado (janela anônima).\n\nO que você fizer a partir de agora se perde ao fechar a aba. Use "Baixar uma cópia" no botão de dados, no topo da tela.');
      }
    }
  }
  function saveUI(){
    try{ localStorage.setItem(UI_KEY, JSON.stringify({cur:catAtualId, sk:sortKey, sd:sortDir, view:view, dark:dark, cent:centavos, tag:fTag, grad:gradiente, pend:soPendentes, anel:contornos, bkp:backupEm, bkpAdiado:lembreteAdiado})); }catch(e){}
  }
  function loadUI(){
    try{
      var raw=localStorage.getItem(UI_KEY); if(!raw) return; var u=JSON.parse(raw); if(!u) return;
      if(u.cur) catAtualId=u.cur;
      if(['parcela','date','onde','status','priority','valor'].indexOf(u.sk)>=0) sortKey=u.sk;
      if(u.sd==='desc') sortDir='desc';
      /* 'cat' virou legado; qualquer preferência antiga salva nele volta ao Mês. */
      if(['mes','cartoes','abast','metas'].indexOf(u.view)>=0) view=u.view;
      soPendentes=!!u.pend;
      if(typeof u.anel==='boolean') contornos=u.anel;
      if(typeof u.cent==='boolean') centavos=u.cent;
      if(typeof u.bkp==='string') backupEm=u.bkp;
      if(typeof u.bkpAdiado==='string') lembreteAdiado=u.bkpAdiado;
      dark=!!u.dark;
      if(typeof u.tag==='string') fTag=u.tag;
      gradiente=!!u.grad;
    }catch(e){}
  }

  // ---- lookups ----
  function findCat(id){ for(var i=0;i<categorias.length;i++){ if(categorias[i].id===id) return categorias[i]; } return null; }
  function findLanc(id){ for(var i=0;i<lancamentos.length;i++){ if(lancamentos[i].id===id) return lancamentos[i]; } return null; }
  function lancsDe(catId){ return lancamentos.filter(function(t){ return t.catId===catId; }); }
  // só o que é conta a pagar conta em "X/Y pagas" e no veredito "em dia"
  function despesasDe(catId){ return lancsDe(catId).filter(function(t){ return !ehEntrada(t); }); }
  /* A categoria da reserva vive dentro da aba. Com a aba DESLIGADA ela não
     tinha mais nenhum caminho: sumia da faixa, a aba não existia, e os
     lançamentos dela seguiam contados no topo sem jeito de abrir. */
  function categoriasVis(){
    if(!metasLigadas()) return categorias.slice();
    return categorias.filter(function(s){ return !s.meta; });
  }
  function catMeta(){ for(var i=0;i<categorias.length;i++){ if(categorias[i].meta) return categorias[i]; } return null; }
  // cor vazia = herda a cor da categoria
  function lancColor(t){
    if(t.color) return t.color;
    var c=findCat(t.catId);
    return c?c.color:'#B7AE9F';
  }
  function valorDe(t){ var v=parseMoeda(t.valor); return (v==null||v<0)?null:v; }
  /* A marcação de quanto já foi pago só faz sentido enquanto a conta está em
     curso — agendada ou paga pela metade. */
  function emCurso(t){ return t.status==='agendado' || t.status==='parcial'; }
  function temProgresso(t){ return emCurso(t) && parseMoeda(t.pago)!=null && valorDe(t)!=null; }
  function pagoPct(t){
    var v=valorDe(t), p=parseMoeda(t.pago);
    if(v==null || v<=0 || p==null) return null;
    return Math.max(0, Math.min(100, Math.round(p/v*100)));
  }
  // quanto ainda falta, já descontando o que foi pago
  function faltaDe(t){
    var v=valorDe(t); if(v==null) return null;
    if(t.status==='pago') return 0;
    var p=parseMoeda(t.pago);
    if(emCurso(t) && p!=null) return Math.max(0, Math.round((v-Math.min(p,v))*100)/100);
    return v;
  }
  function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function rgb2hex(a){ return '#'+a.map(function(x){ var v=Math.round(x).toString(16); return v.length<2?'0'+v:v; }).join(''); }
  function lerpCor(c1,c2,t){
    var a=hex2rgb(c1), b=hex2rgb(c2);
    return rgb2hex([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]);
  }
  /* Padrão: cor do status. Com o gradiente ligado, a barra caminha do vermelho
     (nada pago) ao verde (perto de quitar), passando pelo âmbar no meio. */
  var GRAD_INI='#E8796B', GRAD_MEIO='#EFB65C', GRAD_FIM='#86C77E';
  function corDoProgresso(pct){
    return pct<=50 ? lerpCor(GRAD_INI, GRAD_MEIO, pct/50)
                   : lerpCor(GRAD_MEIO, GRAD_FIM, (pct-50)/50);
  }
  function fundoGradiente(pct){
    return 'linear-gradient(90deg,'+GRAD_INI+','+corDoProgresso(pct)+')';
  }
  /* O gradiente marca pagamento em andamento. "Pago em parte" é uma conta
     parada, então segue com a cor sólida do status. */
  function usaGradiente(t){ return gradiente && t.status==='agendado'; }
  function progFill(t, pct){
    if(!usaGradiente(t)) return (STATUS[t.status]||STATUS.agendado).dot;
    return fundoGradiente(pct);
  }
  function numEditavel(t, valor){
    return '<button class="pedit" data-act="pedit" data-id="'+t.id+'" title="Clique para mudar quanto já foi pago">'+esc(valor)+'</button>';
  }
  /* Barra some quando não há nada a mostrar: é isso que a mantém discreta. */
  function progHtml(t){
    if(!temProgresso(t)){
      /* Digitar um valor acima do total marca a conta como paga — e aí o campo
         sumia junto com a barra, deixando quem errou a digitação sem como
         corrigir a não ser voltando o status na mão. */
      if(t.status==='pago' && parseMoeda(t.pago)!=null && valorDe(t)!=null)
        return '<span class="pnum pnum-fim">'+numEditavel(t,fmtBRL(parseMoeda(t.pago)))+'</span>';
      return '';
    }
    var r=parseMoeda(t.pago), v=valorDe(t), pct=pagoPct(t);
    var falta=faltaDe(t);
    var faltaTxt = (falta!=null && falta>0) ? '<span class="prest">faltam '+esc(fmtBRL(falta))+'</span>'
                 : (falta===0 ? '<span class="prest">quitado</span>' : '');
    if(pct==null) return '<span class="pnum">pago '+numEditavel(t,fmtBRL(r))+'</span>'+faltaTxt;
    return '<span class="pbar'+(usaGradiente(t)?' grad':'')+'" role="img" aria-label="'+pct+'% pago"><span style="width:'+pct+'%;background:'+progFill(t,pct)+'"></span></span>'
      +'<span class="pnum">'+numEditavel(t,fmtBRL(r))+' · '+pct+'%</span>'+faltaTxt;
  }
  function chipOf(cfg){ return dark?cfg.chipD:cfg.chip; }
  function textOf(cfg){ return dark?cfg.textD:cfg.text; }
  function lineOf(cfg){ return dark?cfg.lineD:cfg.line; }

  /* Referência = as contas que vencem HOJE; se não houver nenhuma hoje, as do
     próximo vencimento futuro. Contas vencidas não entram no veredito. */
  function statusCategoria(catId){
    var t0=todayISO();
    // entrada não é conta a pagar: fica fora do veredito de "em dia"
    var lista=despesasDe(catId);
    var datadas=lista.filter(function(t){ return !!t.venc; });
    var late=datadas.filter(function(t){ return t.venc<t0 && t.status!=='pago'; }).length;
    var semData=lista.length - datadas.length;

    var refDate=null;
    if(datadas.some(function(t){ return t.venc===t0; })) refDate=t0;
    else datadas.forEach(function(t){ if(t.venc>t0 && (refDate===null || t.venc<refDate)) refDate=t.venc; });

    if(!refDate) return {kind:'none', late:late, semData:semData, group:[], refDate:null, diff:null, pagas:0, total:0};

    var group=datadas.filter(function(t){ return t.venc===refDate; })
      .sort(function(a,b){ return (a.parcela==null?Infinity:a.parcela)-(b.parcela==null?Infinity:b.parcela); });
    var pagas=0;
    group.forEach(function(t){ if(t.status==='pago') pagas++; });
    return {kind: pagas===group.length ? 'ok' : 'todo', late:late, semData:semData, group:group,
            refDate:refDate, diff:dayDiff(refDate,t0), pagas:pagas, total:group.length};
  }

  function allTagsOf(catId){
    var seen={}, out=[];
    lancsDe(catId).forEach(function(t){ t.tags.forEach(function(g){ if(!seen[g]){ seen[g]=1; out.push(g); } }); });
    out.sort(function(a,b){ return COLL.compare(a,b); });
    return out;
  }

  function lancsAtuais(){
    var q=query.trim().toLowerCase();
    var out=lancsDe(catAtualId).filter(function(t){
      if(soPendentes && t.status==='pago') return false;
      if(fTag && t.tags.indexOf(fTag)<0) return false;
      if(!q) return true;
      return (t.name+' '+(t.descricao||'')+' '+(t.onde||'')+' '+(t.notes||'')+' '+t.tags.join(' ')).toLowerCase().indexOf(q)>=0;
    });
    var chaveNum = parcelaEfetiva(out);
    var dir=sortDir==='asc'?1:-1;
    out.sort(function(a,b){
      var r=0;
      if(sortKey==='parcela'){
        // uma única chave por item, calculada antes de ordenar
        var xa=chaveNum[a.id], xb=chaveNum[b.id];
        r=(xa<xb?-1:xa>xb?1:0)*dir;
      } else if(sortKey==='date'){
        var da=a.venc||'￿', db=b.venc||'￿';
        r=(da<db?-1:da>db?1:0)*dir;
      } else if(sortKey==='status'){
        r=(STATUS_ORDER.indexOf(a.status)-STATUS_ORDER.indexOf(b.status))*dir;
      } else if(sortKey==='priority'){
        r=(PRIO_ORDER.indexOf(a.priority)-PRIO_ORDER.indexOf(b.priority))*dir;
      } else if(sortKey==='valor'){
        var va=valorDe(a), vb=valorDe(b);
        va=(va==null?-1:va); vb=(vb==null?-1:vb);
        r=(va<vb?-1:va>vb?1:0)*dir;
      } else {
        r=COLL.compare(String(a[sortKey]||''),String(b[sortKey]||''))*dir;
      }
      if(r!==0) return r;
      // desempate estável e sem NaN (Infinity - Infinity dava NaN)
      var ka=chaveNum[a.id], kb=chaveNum[b.id];
      if(ka!==kb) return ka<kb?-1:1;
      var ca2=a.venc||'￿', cb2=b.venc||'￿';
      if(ca2!==cb2) return ca2<cb2?-1:1;
      return a.id<b.id?-1:a.id>b.id?1:0;
    });
    return out;
  }

  /* Ordenar por "Parcela" precisa de UMA chave por item, não de um critério que
     muda conforme o par comparado — isso não formava uma ordem total e o
     resultado do sort passava a depender da ordem no array. Quem tem número usa
     o próprio; quem não tem recebe a posição correspondente à sua data. */
  function parcelaEfetiva(lista){
    var numerados=lista.filter(function(t){ return t.parcela!=null; })
      .sort(function(a,b){ return a.parcela-b.parcela; });
    var chave={};
    lista.forEach(function(t){
      if(t.parcela!=null){ chave[t.id]=t.parcela; return; }
      var ancora=-0.5;
      for(var i=0;i<numerados.length;i++){
        var n=numerados[i];
        if(!n.venc || !t.venc) continue;
        if(n.venc<=t.venc) ancora=n.parcela+0.5;
      }
      chave[t.id]=ancora;
    });
    return chave;
  }

  // ---- render: hero ----
  function renderHero(){
    var contas=lancamentos.filter(function(t){ return !ehEntrada(t); });
    var aberto=0, aPagar=0;
    contas.forEach(function(t){
      if(t.status==='pago') return;
      var f=faltaDe(t); if(f!=null){ aberto+=f; aPagar++; }
    });
    /* Sublinha enxuta: o período (se houver) e a única informação que importa
       de relance — quanto ainda falta pagar. O resto (contagem de categorias,
       "categorias em dia") virou ruído depois que a navegação deixou de ser
       por categoria. */
    var partes=[];
    if(appCfg.periodo) partes.push(esc(appCfg.periodo));

      +'<h1>'+esc(appCfg.titulo)+'</h1>'
      +'<p class="sub">'+partes.join(' · ')+'</p></div></div>';

  // ---- teto e gastos avulsos ----
  function gastoAvulsoMes(cat, ym){
    var t=0;
    (cat.avulsos||[]).forEach(function(a){ if(mesDe(a.d)===ym) t+=a.v; });
    return Math.round(t*100)/100;
  }
  function tetoTom(usado, teto){
    if(!teto) return EMDIA.none;
    var p=usado/teto;
    if(p>=1) return EMDIA.todo;
    if(p>=0.75) return {dot:STATUS.agendado.dot, text:STATUS.agendado.text, textD:STATUS.agendado.textD};
    return {dot:STATUS.pago.dot, text:STATUS.pago.text, textD:STATUS.pago.textD};
  }
  /* Fechado, o botão já entrega o essencial: a barrinha e o quanto sobra.
     Aberto, vira o painel de registro — sem virar uma aba separada. */
  function tetoChip(cat){
    if(!cat.teto) return '';
    var ym=mesDe(todayISO());
    var usado=gastoAvulsoMes(cat, ym), teto=cat.teto;
    var tom=tetoTom(usado, teto);
    var pct=Math.max(0, Math.min(100, Math.round(usado/teto*100)));
    var slots='<span class="mini-slots" aria-hidden="true">'+Array.apply(null,{length:10}).map(function(_,i){
      return '<span class="mini-slot"'+(i<Math.round(pct/10)?' style="background:'+tom.dot+'"':'')+'></span>';
    }).join('')+'</span>';
    return '<button class="chip-btn'+(tetoAberto?' on':'')+'" data-act="toggleteto"'
      +' aria-expanded="'+tetoAberto+'" title="Gastos avulsos de '+esc(cat.name)+' neste mês">'
      +svg(IC.clock,14)+'<span class="chip-lbl">Avulsos</span>'+slots
      +'<b style="color:'+(dark?tom.textD:tom.text)+'">'+esc(fmtBRL(usado))+'</b>'
      +'<span class="chip-caret">'+SVG_CARET+'</span></button>';
  }
  function tetoPainel(cat){
    if(!tetoAberto || !cat.teto) return '';
    var ym=mesDe(todayISO());
    var usado=gastoAvulsoMes(cat, ym), teto=cat.teto;
    var rest=Math.round((teto-usado)*100)/100, estourou=usado>=teto;
    var tom=tetoTom(usado, teto), cor=dark?tom.textD:tom.text;
    var pct=Math.max(0, Math.min(100, Math.round(usado/teto*100)));
    var msg = estourou ? 'Passou do teto de '+esc(fmtBRL(teto))+' em '+esc(fmtBRL(usado-teto))+'.'
            : 'Ainda cabem <b>'+esc(fmtBRL(rest))+'</b> no teto de '+esc(fmtBRL(teto))+' deste mês.';
    var doMes=(cat.avulsos||[]).filter(function(a){ return mesDe(a.d)===ym; })
      .slice().sort(function(a,b){ return a.d<b.d?1:(a.d>b.d?-1:0); });
    var lista = doMes.length
      ? '<div class="flist">'+doMes.map(function(a,i){
          return '<div class="frow"><span class="fnum">'+(doMes.length-i)+'</span>'
            +'<span class="fdate">'+fmtDate(a.d)+'</span>'
            +(a.o?'<span class="fwhen">'+esc(a.o)+'</span>':'')
            +'<span class="fval">'+esc(fmtBRL(a.v))+'</span>'
            +'<button class="icon-btn danger" data-act="delavulso" data-sid="'+cat.id+'" data-d="'+esc(a.d)+'" data-v="'+a.v+'" title="Remover este registro">'+SVG_TRASH+'</button></div>';
        }).join('')+'</div>'
      : '<div class="fnone">Nenhum gasto avulso registrado neste mês.</div>';
    return '<div class="fpanel"><div class="fmsg" style="color:'+cor+'">'+msg+'</div>'
      +'<span class="fbar"><span style="width:'+pct+'%;background:'+tom.dot+'"></span></span>'
      +lista
      +'<div class="fadd"><input type="date" value="'+todayISO()+'" data-fdate aria-label="Data do gasto">'
      +'<input type="text" inputmode="decimal" placeholder="R$ 0,00" data-fval aria-label="Valor do gasto">'
      +'<input type="text" placeholder="Observação (opcional)" data-fobs aria-label="Observação" maxlength="60">'
      +'<button class="btn-wine" data-act="addavulso" data-sid="'+cat.id+'">'
      +svg(IC.plus,15)+' Registrar</button></div></div>';
  }
  /* Vencimento e observação numa linha só, e só quando existem. */
  function vencLinha(cat){
    var partes=[];
    var h=vencTexto(cat);
    if(h) partes.push('<span class="aula-h">'+svg(IC.cal,12)+' Vence '+esc(h)+'</span>');
    if(cat.obs) partes.push('<span class="aula-l">'+svg(IC.pin,12)+' '+esc(cat.obs)+'</span>');
    if(!partes.length) return '';
    return '<div class="subj-aula">'+partes.join('')+'</div>';
  }
  function linkChip(cat){
    var u=safeUrl(cat.link);
    if(!u) return '';
    return '<a class="chip-btn" href="'+esc(u)+'" target="_blank" rel="noopener">'
      +svg(IC.link,14)+'<span class="chip-lbl">Abrir no banco</span></a>';

  /* Zero categorias E zero lançamentos = ninguém nunca usou este navegador. Aí
     a tela não é uma lista vazia com um aviso, é o convite para começar. */
  function primeiraVez(){
    if(categorias.length || lancamentos.length) return false;
    if(metas && ((metas.marcos&&metas.marcos.length) || (metas.conferencias&&metas.conferencias.length) || metas.titulo)) return false;
    try{ return !localStorage.getItem(STORAGE_KEY); }catch(e){ return true; }
  }
  function bemVindoHtml(){

      +'<h2>Vamos começar</h2>'

      +'<div class="bv-passos">'

        +'<div class="bv-passo"><span class="bv-n">2</span><span><b>Cadastre as contas</b> com o valor e a data em que vencem.</span></div>'
        +'<div class="bv-passo"><span class="bv-n">3</span><span><b>Marque o que já pagou.</b> O topo da página diz se você está em dia.</span></div>'
      +'</div>'
      +'<div class="bv-acoes">'
        +'<button class="btn-wine" data-act="bv-cat">'+svg(IC.plus,15)+' Criar a primeira categoria</button>'
        +'<button class="btn-ghost" data-act="bv-importar">'+svg(IC.up,15)+' Tenho um backup</button>'
        +'<button class="btn-ghost" data-act="bv-exemplo">Ver um exemplo</button>'
      +'</div>'
      +'<p class="hint" style="margin-top:16px">O exemplo é fictício. Dá para apagar tudo depois, no botão de dados lá em cima.</p>'
    +'</div>';

  function renderPanel(){

        +vencLinha(s)+'</div>'

      +emDiaHtml(statusCategoria(s.id))
      +(chips?'<div class="subj-chips">'+chips+'</div>':'')
      +tetoPainel(s)
      +'</div>';
    renderTagbar();
    renderTable();

  function renderTagbar(){
    var tags=allTagsOf(catAtualId);
    // filtro de tag que não existe nesta categoria esconderia tudo sem aviso
    if(fTag && tags.indexOf(fTag)<0) fTag='';

    }).join('')+(fTag?'<button class="tag-chip" data-act="tagclear">'+svg(IC.x,10)+' limpar</button>':'');

  // ---- render: tabela ----
  function statusPill(t){
    var cfg=STATUS[t.status]||STATUS.pendente;
    return '<div class="pill-wrap"><button class="pill" data-act="pill" data-id="'+t.id+'" style="background:'+chipOf(cfg)+';color:'+textOf(cfg)+'" aria-haspopup="true" aria-expanded="'+(openMenuId===t.id)+'">'
      +'<span class="pill-dot" style="background:'+cfg.dot+'"></span>'+esc(rotuloStatus(t))+' '+SVG_CARET+'</button></div>';
  }
  /* O menu vive fora da tabela, em camada fixa: dentro dela ficava recortado
     pelo overflow do contêiner e era difícil de clicar. */
  function renderStatusMenu(){
    var el=document.getElementById('statusmenu');
    var t=openMenuId?findLanc(openMenuId):null;
    /* A visão escondida guarda o HTML antigo, então o mesmo item pode ter duas
       pills no documento. Procurar só dentro da visão ativa evita medir a
       escondida, que devolve zero e jogava o menu para o canto da tela. */
    var cont = view==='mes' ? mesEl : (view==='metas' ? metasEl : (view==='cartoes' ? cartoesEl : tw));
    var btn = (t && cont) ? cont.querySelector('.pill[data-act="pill"][data-id="'+openMenuId+'"]') : null;
    if(!t||!btn){ if(el) el.parentNode.removeChild(el); return; }
    var r0=btn.getBoundingClientRect();
    if(!r0.width && !r0.height){ if(el) el.parentNode.removeChild(el); return; }
    menuScroll={x:window.pageXOffset, y:window.pageYOffset};
    if(!el){
      el=document.createElement('div');
      el.id='statusmenu'; el.className='menu'; el.setAttribute('role','menu');
      el.setAttribute('aria-label','Situação do pagamento');
      /* Sem isto o menu abria mas o foco ficava no <body>: as setas rolavam a
         página (fechando o menu) e o Tab pulava para o topo da tabela. */
      el.addEventListener('keydown', function(ev){
        var itens=Array.prototype.slice.call(el.querySelectorAll('.menu-item'));
        if(!itens.length) return;
        var i=itens.indexOf(document.activeElement);
        if(ev.key==='ArrowDown' || ev.key==='ArrowUp'){
          ev.preventDefault(); ev.stopPropagation();
          var passo = ev.key==='ArrowDown' ? 1 : -1;
          var alvo = itens[(Math.max(i,0)+passo+itens.length)%itens.length];
          if(alvo) alvo.focus();
        } else if(ev.key==='Home' || ev.key==='End'){
          ev.preventDefault(); ev.stopPropagation();
          itens[ev.key==='Home'?0:itens.length-1].focus();
        } else if(ev.key==='Escape' || ev.key==='Tab'){
          var idAberto=openMenuId;
          openMenuId=null; renderMain();
          var volta=document.querySelector('.pill[data-act="pill"][data-id="'+idAberto+'"]');
          if(volta){ ev.preventDefault(); volta.focus(); }
        }
      });
      el.addEventListener('click', function(e){
        var b=e.target.closest('[data-act="setstatus"]'); if(!b) return;
        e.stopPropagation();
        aplicarStatus(findLanc(b.getAttribute('data-id')), b.getAttribute('data-s'));
        openMenuId=null; persist(); renderAll();
      });
      app.appendChild(el);
    }
    el.innerHTML=STATUS_ORDER.map(function(st){
      var atual=(st===t.status);
      var rot = ehEntrada(t) ? (ENTRADA_LABEL[st]||STATUS[st].label) : STATUS[st].label;
      return '<button class="menu-item" role="menuitemradio" aria-checked="'+atual+'"'
        +' data-act="setstatus" data-id="'+esc(t.id)+'" data-s="'+st+'">'
        +'<span class="pill-dot" aria-hidden="true" style="background:'+STATUS[st].dot+'"></span>'+esc(rot)
        +(atual?'<span class="check" aria-hidden="true">✓</span>':'')+'</button>';
    }).join('');
    var r=r0;
    el.style.visibility='hidden';
    var h=el.offsetHeight, w=el.offsetWidth;
    var top=r.bottom+5, left=r.left;
    if(top+h > window.innerHeight-8) top=r.top-h-5;   // não coube abaixo: abre para cima
    top  = Math.min(Math.max(8, top),  Math.max(8, window.innerHeight-h-8));
    left = Math.min(Math.max(8, left), Math.max(8, window.innerWidth-w-8));
    el.style.top=top+'px'; el.style.left=left+'px'; el.style.visibility='';
    if(menuPorTeclado){
      menuPorTeclado=false;
      var atual2=el.querySelector('.menu-item[aria-checked="true"]') || el.querySelector('.menu-item');
      if(atual2) atual2.focus();
    }
  }
  /* Marcar como paga preenche o valor pago sozinho: é o que a pessoa quer dizer
     ao tocar em "Pago", e sem isso o gráfico do mês seguia contando a conta
     como aberta. */
  function aplicarStatus(t, novo){
    if(!t || !temValor(STATUS, novo)) return;
    t.status=novo;
    var v=valorDe(t);
    if(novo==='pago' && v!=null) t.pago=v;
    if(novo==='pendente') t.pago=null;
  }
  /* Vencida = a data já passou e a conta não foi paga. É a informação mais
     urgente da lista. */
  function atrasado(t){
    if(!t.venc || t.status==='pago') return false;
    var d=dayDiff(t.venc);
    return d!=null && d<0;
  }
  function dateCell(t){
    if(!t.venc) return '<span class="muted">—</span>';
    var d=dayDiff(t.venc);
    var atr=atrasado(t);
    var cls = atr ? 'late' : (d===0 ? 'today' : ((d!=null && d>0 && d<=3) ? 'soon' : ''));
    return fmtDate(t.venc)+'<span class="date-rel '+cls+'">'
      +(atr?'vencida · ':'')+relLabel(d)+'</span>';
  }
  /* A entrada se distingue por uma etiqueta com o tipo, não por outra cor de
     linha — assim ela continua lendo como parte da mesma lista. */
  function entBadge(t){
    if(!ehEntrada(t)) return '';
    return '<span class="ent-badge">'+svg(IC.down,10)+' '+esc(tipoEntrada(t))+'</span>';
  }
  /* Recua visualmente sem sair do lugar. Vale para tudo que já venceu e, além
     disso, para o que foi pago hoje — esse também já cumpriu o seu papel. */
  function jaPassou(t){
    if(!t.venc) return false;
    var d=dayDiff(t.venc);
    if(d==null) return false;
    if(d<0) return true;
    return d===0 && t.status==='pago';
  }
  /* Uma cor escolhida escura some contra o papel escuro. Aqui ela é clareada só
     o quanto for preciso para o anel aparecer — o matiz continua o escolhido. */
  function lumRel(hex){
    var c=hex2rgb(hex).map(function(v){ v/=255;
      return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); });
    return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
  }
  function razao(a,b){ var x=lumRel(a), y=lumRel(b);
    return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
  function corVisivel(cor){
    if(!dark || !/^#[0-9a-f]{6}$/i.test(cor)) return cor;
    var fundo='#2d2822';                      // --card do tema escuro
    var c=cor;
    for(var i=0;i<12 && razao(c,fundo)<2.6;i++) c=lerpCor(c,'#FFFFFF',0.12);
    return c;
  }
  function corDoAnel(t, isRef){
    if(isRef) return corVisivel((STATUS[t.status]||STATUS.pendente).dot);
    if(ehEntrada(t)) return corVisivel(lancColor(t));
    return '';
  }
  function anelAttr(t, isRef){
    if(!contornos) return {cls:'', style:''};
    var c=corDoAnel(t, isRef);
    if(!c) return {cls:'', style:''};
    return {cls:' com-anel', style:'--anel:'+esc(c)+';'};
  }
  function prioBadge(t){
    if(t.priority==='normal') return '';
    return '<span class="prio '+PRIO[t.priority].cls+'">'+PRIO[t.priority].label+'</span>';
  }
  function tagsHtml(t){
    if(!t.tags.length) return '';
    return '<div class="row-tags">'+t.tags.map(function(g){
      return '<button class="rtag" data-act="tagf" data-t="'+esc(g)+'">'+esc(g)+'</button>';
    }).join('')+'</div>';
  }
  function valorCell(t){
    var v=valorDe(t);
    if(v==null) return '<span class="muted">—</span>';
    return '<span class="valor-lin '+(ehEntrada(t)?'entrada':'saida')+'">'
      +(ehEntrada(t)?'+ ':'')+esc(fmtBRL(v))+'</span>';
  }
  function rowHtml(t){
    var color=lancColor(t);
    var isRef=!!curRefIds[t.id];
    var refBadge=isRef?'<span class="ref-badge">'+(curRefDiff===0?'hoje':'próximo')+'</span>':'';
    var link=safeUrl(t.link);
    var linkHtml=link?' <a class="text-link" href="'+esc(link)+'" target="_blank" rel="noopener" title="Abrir link" data-stop>'+SVG_LINK+'</a>':'';
    var cls=[]; if(isRef) cls.push('is-ref'); if(ehEntrada(t)) cls.push('is-entrada');
    if(jaPassou(t)) cls.push('ja-passou');
    var anel=anelAttr(t, isRef);
    if(anel.cls) cls.push(anel.cls.trim());
    if(atrasado(t)) cls.push('atrasado');
    return '<tr'+(cls.length?' class="'+cls.join(' ')+'"':'')+(anel.style?' style="'+anel.style+'"':'')+'>'
      +'<td class="c-num">'+(t.parcela!=null
          ? '<span class="num-badge" style="background:'+color+'">'+t.parcela+'</span>'
          : '<span class="num-vazio" style="border-color:'+color+'" aria-hidden="true"></span>')+'</td>'
      +'<td class="c-text"><span class="text-name">'+esc(t.name)+'</span>'+linkHtml+entBadge(t)+prioBadge(t)+refBadge
        +(t.descricao?'<span class="orig">'+esc(t.descricao)+'</span>':'')
        +(t.notes?'<span class="nota" title="'+esc(t.notes)+'">'+svg(IC.nota,11)+' '+esc(t.notes)+'</span>':'')
        +tagsHtml(t)+'</td>'

        +progHtml(t)
        +tagsHtml(t)
      +'</div></div>'
      +'<div class="tc-bottom">'+statusPill(t)
      +'<div class="tc-acts">'+(t.venc?'<button class="icon-btn" data-act="adiar" data-id="'+esc(t.id)+'" title="Adiar para o próximo vencimento" aria-label="'+esc('Adiar '+t.name)+'">'+svg(IC.adiar,15)+'</button>':'')
      +'<button class="icon-btn" data-act="edit" data-id="'+esc(t.id)+'" title="Editar" aria-label="'+esc('Editar '+t.name)+'">'+SVG_PENCIL+'</button></div></div>'
      +'</div>';

  function headCell(k,label,cls){
    var on=sortKey===k;
    var arrow=(on && sortDir==='desc')?'▾':'▴';
    var dir = on ? (sortDir==='desc'?'descending':'ascending') : 'none';
    return '<th class="'+cls+' sortable" aria-sort="'+dir+'">'
      +'<button type="button" class="th-btn" data-act="sort" data-k="'+k+'">'+label
      +'<span class="sort-ar" aria-hidden="true" style="opacity:'+(on?1:0.22)+'">'+arrow+'</span></button></th>';
  }
  /* A busca vale para a categoria aberta — mas dizer só "nada encontrado"
     seria esconder a conta de quem a procura. Quando o termo existe noutra
     categoria, a tela mostra onde, com um botão que leva até lá. */
  function casa(t, q){
    return (t.name+' '+(t.descricao||'')+' '+(t.onde||'')+' '+(t.notes||'')+' '+t.tags.join(' '))
      .toLowerCase().indexOf(q)>=0;
  }
  function achadosNoutrasCategorias(){
    var q=query.trim().toLowerCase();
    if(!q) return [];
    var conta={};
    lancamentos.forEach(function(t){
      if(t.catId===catAtualId) return;
      if(!casa(t,q)) return;
      conta[t.catId]=(conta[t.catId]||0)+1;
    });
    return categoriasVis().filter(function(c){ return conta[c.id]; })
      .map(function(c){ return {cat:c, n:conta[c.id]}; });
  }
  function dicaOutras(){
    var achados=achadosNoutrasCategorias();
    if(!achados.length) return '';
    var total=achados.reduce(function(a,x){ return a+x.n; },0);
    return '<div class=\"outras\">'
      +'<span>'+total+(total===1?' resultado':' resultados')+' fora desta categoria:</span> '
      +achados.map(function(x){
          return '<button type=\"button\" class=\"outra-cat\" data-act=\"ircat\" data-id=\"'+esc(x.cat.id)+'\">'
            +'<span class=\"oc-bola\" style=\"background:'+esc(x.cat.color)+'\"></span>'
            +esc(x.cat.name)+' <b>'+x.n+'</b></button>';
        }).join('')
      +'</div>';
  }
  function renderTable(){
    var s=findCat(catAtualId); if(!s){ tw.innerHTML=''; return; }
    var stRef=statusCategoria(s.id);
    curRefIds={}; curRefDiff=stRef.diff;
    stRef.group.forEach(function(t){ curRefIds[t.id]=1; });

    var list=lancsAtuais();
    var totalCat=lancsDe(s.id).length;
    var html='';
    if(list.length===0){
      html='<div class="empty">'+(totalCat===0
        ? '<p class="empty-big">Nenhuma conta nesta categoria ainda.</p><p>Clique em <strong>Adicionar</strong> para começar.</p>'
        : (soPendentes && !query && !fTag
            ? '<p class="empty-big">Tudo pago nesta categoria.</p><button class="btn-ghost sm" data-act="verpend">Mostrar também as pagas</button>'
            : '<p class="empty-big">Nada encontrado nesta categoria.</p>'+dicaOutras()
              +'<button class="btn-ghost sm" data-act="clearsearch">Limpar busca e filtros</button>'))+'</div>';
    } else if(narrow){
      html=dicaOutras()+'<div class="tcards">'+list.map(cardHtml).join('')+'</div>';
    } else {
      var head='<thead><tr>'
        +headCell('parcela','Parc.','c-num')
        +'<th class="c-text">Conta</th>'
        +headCell('onde','Onde / quem','c-author')
        +headCell('date','Vencimento','c-date')
        +headCell('valor','Valor','c-valor')
        +headCell('status','Situação','c-status')
        +'<th class="c-actions"></th></tr></thead>';
      html=dicaOutras()+'<table>'+head+'<tbody>'+list.map(rowHtml).join('')+'</tbody></table>';
    }
    tw.innerHTML=html;
    renderStatusMenu();
    var pend=0, pendVal=0, entPend=0, entVal=0;
    list.forEach(function(t){
      if(t.status==='pago') return;
      var m=faltaDe(t)||0;
      if(ehEntrada(t)){ entPend++; entVal+=m; return; }
      pend++; pendVal+=m;
    });
    foot.innerHTML='Mostrando '+list.length+' de '+totalCat+' item(ns)'
      +(soPendentes?' · filtro "falta pagar" ligado':'')
      +(pend?' · '+pend+' a pagar'+(pendVal?' ('+esc(fmtBRL(pendVal))+')':''):'')
      +(entPend?' · '+entPend+' a receber'+(entVal?' ('+esc(fmtBRL(entVal))+')':''):'')
      +textoSalvo(true)+'<br>'
      +atalhos('<span class="kbd">n</span> nova conta · <span class="kbd">/</span> buscar · <span class="kbd">s</span> alternar visão'
      +(metasLigadas()?' · <span class="kbd">r</span> '+esc(rotuloMetas()):'')+' · <span class="kbd">Esc</span> fechar')
      +selo();
    saveUI();
  }

  // ---- render: visão do mês ----
  function mesAtivo(){ return mesSoma(mesDe(todayISO()), mesOff); }
  function resumoDoMes(ym){
    var entra=0, sai=0, pagoV=0, faltaV=0, contas=0, pagas=0;
    lancamentos.forEach(function(t){
      if(mesDe(t.venc)!==ym) return;
      var v=valorDe(t); if(v==null) v=0;
      if(ehEntrada(t)){ entra+=v; return; }
      sai+=v; contas++;
      if(t.status==='pago') pagas++;
      var f=faltaDe(t); if(f!=null){ faltaV+=f; pagoV+=(v-f); } else pagoV+=0;
    });
    var r=function(x){ return Math.round(x*100)/100; };
    return {entra:r(entra), sai:r(sai), sobra:r(entra-sai), pago:r(pagoV), falta:r(faltaV),
            contas:contas, pagas:pagas};
  }
  function resumoHtml(){
    var ym=mesAtivo(), d=resumoDoMes(ym);
    var negativa=d.sobra<0;
    /* O mês fica ENTRE as setas, não num título separado: no celular as duas
       coisas caíam em linhas diferentes e as setas viravam uma barra vazia,
       sem dizer o que iam mudar. */
    var nav='<div class="mesnav">'
      +'<button class="mn-seta" data-act="mes-" title="Mês anterior" aria-label="Mês anterior">'+svg(IC.esq,15)+'</button>'
      +'<div class="mn-mid"><span class="mn-mes" aria-live="polite">'+esc(mesLabel(ym))+'</span>'
      +(mesOff!==0?'<button class="mn-hoje" data-act="mes0">voltar para hoje</button>'
                  :'<span class="mn-hoje-off">mês de hoje</span>')+'</div>'
      +'<button class="mn-seta" data-act="mes+" title="Próximo mês" aria-label="Próximo mês">'+svg(IC.dir,15)+'</button>'
      +'</div>';
    var cards='<div class="resumo">'
      +'<div class="rcard entra"><div class="rcard-n">'+esc(fmtCurto(d.entra))+'</div><div class="rcard-l">entra</div></div>'
      +'<div class="rcard sai"><div class="rcard-n">'+esc(fmtCurto(d.sai))+'</div><div class="rcard-l">sai</div></div>'
      +'<div class="rcard sobra'+(negativa?' neg':'')+'"><div class="rcard-n">'+esc(fmtCurto(d.sobra))+'</div>'
      +'<div class="rcard-l">'+(negativa?'falta para fechar o mês':'sobra no mês')+'</div></div>'
      +'</div>';
    var linha = d.contas
      ? '<p class="late-note" style="margin:10px 2px 0"><b>'+d.pagas+' de '+d.contas+'</b> contas pagas'
        +(d.falta>0?' · ainda falta pagar <b>'+esc(fmtBRL(d.falta))+'</b>':' · tudo quitado')+'</p>'
      : '<p class="late-note" style="margin:10px 2px 0">Nenhuma conta com vencimento neste mês.</p>';
    return nav+cards+linha;
  }
  function mesData(){
    var t0=todayISO();
    var g={late:[], today:[], tomorrow:[], soon:[], later:[]};
    lancamentos.forEach(function(t){
      if(!t.venc) return;
      var d=dayDiff(t.venc,t0);
      if(d==null) return;
      if(d<0){ if(t.status!=='pago') g.late.push(t); }
      else if(d===0) g.today.push(t);
      else if(d===1) g.tomorrow.push(t);
      else if(d<=7) g.soon.push(t);
      else g.later.push(t);
    });
    var by=function(a,b){
      if(a.venc!==b.venc) return a.venc<b.venc?-1:1;
      var pa=PRIO_ORDER.indexOf(a.priority), pb=PRIO_ORDER.indexOf(b.priority);
      if(pa!==pb) return pa-pb;
      return (a.parcela==null?Infinity:a.parcela)-(b.parcela==null?Infinity:b.parcela);
    };
    Object.keys(g).forEach(function(k){ g[k].sort(by); });
    return g;
  }
  function mesItem(t){
    var s=findCat(t.catId);
    var link=safeUrl(t.link);
    var anelW=anelAttr(t, false);
    return '<div class="witem'+(ehEntrada(t)?' is-entrada':'')+(jaPassou(t)?' ja-passou':'')+(atrasado(t)?' atrasado':'')
      +anelW.cls+'"'+(anelW.style?' style="'+anelW.style+'"':'')+'>'
      +'<span class="wsub" title="'+esc(s?s.name:'')+'"><span class="sdot" style="background:'+(s?s.color:'#999')+'"></span>'+esc(s?s.name:'—')+'</span>'
      +'<div class="wmain"><span class="wname">'+esc(t.name)+'</span>'
        +(link?' <a class="text-link" href="'+esc(link)+'" target="_blank" rel="noopener" data-stop title="Abrir link">'+SVG_LINK+'</a>':'')
        +entBadge(t)+prioBadge(t)
        +(t.notes?'<span class="nota" title="'+esc(t.notes)+'">'+svg(IC.nota,11)+' '+esc(t.notes)+'</span>':'')
        +'<div class="wmeta">'+(t.parcela!=null?'parc. '+t.parcela+' · ':'')+fmtDate(t.venc)+' · '+relLabel(dayDiff(t.venc))
        +(t.onde?' · '+esc(t.onde):'')+'</div>'
        +valorCell(t)+progHtml(t)+'</div>'
      +'<div class="wright">'+statusPill(t)
        +(t.venc?'<button class="icon-btn" data-act="adiar" data-id="'+esc(t.id)+'" title="Adiar para o próximo vencimento" aria-label="'+esc('Adiar '+t.name)+'">'+svg(IC.adiar,15)+'</button>':'')
        +'<button class="icon-btn" data-act="edit" data-id="'+esc(t.id)+'" title="Editar" aria-label="'+esc('Editar '+t.name)+'">'+SVG_PENCIL+'</button></div>'
      +'</div>';

  function mesGroup(title, dot, items, note, cls){
    if(!items.length) return '';
    return '<div class="wgroup'+(cls?' '+cls:'')+'"><div class="wgroup-h" role="heading" aria-level="2">'
      +'<span class="gdot" aria-hidden="true" style="background:'+esc(corSegura(dot,'#B7AE9F'))+'"></span>'+esc(title)
      +'<span class="gn">'+items.length+'</span></div>'
      +items.map(mesItem).join('')
      +(note?'<div class="wempty" style="padding:11px 15px;text-align:left">'+esc(note)+'</div>':'')
      +'</div>';

  function renderMes(){
    /* Depois de "apagar tudo" não há calendário para mostrar — a tela vira o
       convite para recomeçar, aqui mesmo no Mês (a antiga aba que o hospedava
       não existe mais). */
    if(primeiraVez()){
      mesEl.innerHTML=bemVindoHtml();
      foot.innerHTML=selo(); saveUI(); return;
    }
    var body='';
    if(mesOff===0){
      var g=mesData();
      var LATER_CAP=8;
      var laterShown=g.later.slice(0,LATER_CAP);
      var laterNote=g.later.length>LATER_CAP ? ('+ '+(g.later.length-LATER_CAP)+' item(ns) mais adiante não exibidos aqui — veja na categoria.') : '';
      /* As vencidas continuam no fim (uma tela que abre com atraso desanima e
         esconde o que ainda dá para resolver), mas o app não pode deixar você
         descobrir o atraso rolando: o aviso vem no topo, com o atalho. */
      /* Conta a pagar e dinheiro a receber atrasam de jeitos diferentes: juntar
         os dois num número só ("6 contas venceram · R$700") diria que você deve
         o que na verdade está esperando receber. */
      var lateSai=g.late.filter(function(t){ return !ehEntrada(t); });
      var lateEnt=g.late.filter(ehEntrada);
      var devo=lateSai.reduce(function(a,t){ return a+(faltaDe(t)||0); },0);
      var esperando=lateEnt.reduce(function(a,t){ return a+(faltaDe(t)||0); },0);
      var partes=[];
      if(lateSai.length) partes.push('<b>'+lateSai.length+(lateSai.length===1?' conta venceu':' contas venceram')+'</b>'
        +(devo>0?' ('+esc(fmtBRL(devo))+' em aberto)':''));
      if(lateEnt.length) partes.push('<b>'+lateEnt.length+(lateEnt.length===1?' entrada não chegou':' entradas não chegaram')+'</b>'
        +(esperando>0?' ('+esc(fmtBRL(esperando))+')':''));
      var aviso = g.late.length
        ? '<div class="alerta-atraso"><span class="aa-dot" aria-hidden="true"></span>'
          +'<span>'+partes.join(' · ')+'.</span>'
          +'<button type="button" class="aa-ir" data-act="ir-vencidas">ver</button></div>'
        : '';
      body=aviso
        + mesGroup('Hoje', EMDIA.todo.dot, g.today)
        + mesGroup('Amanhã', STATUS.agendado.dot, g.tomorrow)
        + mesGroup('Próximos 7 dias', STATUS.parcial.dot, g.soon)
        + mesGroup('Mais adiante', STATUS.pendente.dot, laterShown, laterNote)
        + (g.late.length ? '<div class="wsep"><span>já venceram</span></div>' : '')
        + mesGroup('Vencidas — não contam para o "em dia"', '#8A8073', g.late, null, 'past vencidas-alvo');
      if(!body) body='<div class="wgroup"><div class="wempty">Nenhuma conta com vencimento cadastrado.<br>Adicione datas para vê-las aqui.</div></div>';
      /* Sem a antiga aba "por categoria", itens sem data (a lista de cuidados,
         uma vacina a marcar, a anuidade do cartão) não teriam onde aparecer.
         Ficam aqui embaixo, recolhidos, para não sumirem nem atrapalharem. */
      body += semVencimentoBloco();
    } else {
      /* Fora do mês de hoje, agrupar por "amanhã" e "próximos 7 dias" seria
         mentira: ali o que importa é a lista do mês inteiro, em ordem de data. */
      var ym=mesAtivo();
      var doMes=lancamentos.filter(function(t){ return mesDe(t.venc)===ym; })
        .sort(function(a,b){ return a.venc<b.venc?-1:(a.venc>b.venc?1:0); });
      body = doMes.length
        ? mesGroup('Vencimentos de '+mesLabel(ym), STATUS.pendente.dot, doMes)
        : '<div class="wgroup"><div class="wempty">Nada com vencimento em '+esc(mesLabel(ym))+'.</div></div>';
    }
    mesEl.innerHTML=resumoHtml()+'<div style="height:13px"></div>'+body;
    renderStatusMenu();
    var d=resumoDoMes(mesAtivo());
    foot.innerHTML='Visão de todas as categorias · '+esc(mesLabel(mesAtivo()))
      +' · entra '+esc(fmtBRL(d.entra))+', sai '+esc(fmtBRL(d.sai))
      +textoSalvo(false)+'<br>'
      +atalhos('<span class="kbd">n</span> nova conta · <span class="kbd">s</span> trocar de aba'
      +' · <span class="kbd">p</span> '+esc(rotuloMetas())+' · <span class="kbd">Esc</span> fechar')
      +selo();
    saveUI();
  }
  /* Uma categoria pode ter itens sem data (checklist, lembretes). Eles não
     entram no calendário, mas também não podem evaporar. */
  function semData(){
    return lancamentos.filter(function(t){ return !t.venc; });
  }
  function semDataItem(t){
    var s=findCat(t.catId);
    var link=safeUrl(t.link);
    return '<div class="witem sd'+(ehEntrada(t)?' is-entrada':'')+'">'
      +'<span class="wsub" title="'+esc(s?s.name:'')+'"><span class="sdot" style="background:'+(s?s.color:'#999')+'"></span>'+esc(s?s.name:'—')+'</span>'
      +'<div class="wmain"><span class="wname">'+esc(t.name)+'</span>'
        +(link?' <a class="text-link" href="'+esc(link)+'" target="_blank" rel="noopener" data-stop title="Abrir link">'+SVG_LINK+'</a>':'')
        +entBadge(t)+prioBadge(t)
        +(t.notes?'<span class="nota" title="'+esc(t.notes)+'">'+svg(IC.nota,11)+' '+esc(t.notes)+'</span>':'')
        +valorCell(t)+'</div>'
      +'<div class="wright">'+statusPill(t)
        +'<button class="icon-btn" data-act="edit" data-id="'+esc(t.id)+'" title="Editar" aria-label="'+esc('Editar '+t.name)+'">'+SVG_PENCIL+'</button></div>'
      +'</div>';
  }
  function semVencimentoBloco(){
    var lista=semData();
    if(!lista.length) return '';
    /* Agrupa por categoria e ordena por prioridade dentro de cada uma, para a
       lista de cuidados não virar uma pilha aleatória. */
    var porCat={}, ordemCat=[];
    lista.forEach(function(t){
      if(!porCat[t.catId]){ porCat[t.catId]=[]; ordemCat.push(t.catId); }
      porCat[t.catId].push(t);
    });
    var corpo=ordemCat.map(function(cid){
      var c=findCat(cid);
      var itens=porCat[cid].slice().sort(function(a,b){ return PRIO_ORDER.indexOf(a.priority)-PRIO_ORDER.indexOf(b.priority); });
      return '<div class="sd-cat"><div class="sd-cat-h"><span class="sdot" style="background:'+(c?c.color:'#999')+'"></span>'
        +esc(c?c.name:'—')+'<span class="gn">'+itens.length+'</span></div>'
        +itens.map(semDataItem).join('')+'</div>';
    }).join('');
    return '<details class="recolhe sem-venc"><summary>Sem vencimento · lembretes e listas <span class="sv-n">'+lista.length+'</span></summary>'
      +'<div class="sv-corpo">'+corpo+'</div></details>';
  }

  // ---- aba: cartões ----
  function cartoesLista(){ return categorias.filter(function(c){ return c.tipo==='cartao'; }); }
  function faturasDe(cartao){
    /* Cada lançamento de um cartão é uma fatura (ou parcela). A "atual" é a
       primeira ainda não paga em ordem de vencimento; as outras não pagas são
       as futuras. As pagas ficam guardadas à parte. */
    var todas=despesasDe(cartao.id).slice().sort(function(a,b){
      var va=a.venc||'￿', vb=b.venc||'￿';
      if(va!==vb) return va<vb?-1:1;
      return (a.parcela==null?Infinity:a.parcela)-(b.parcela==null?Infinity:b.parcela);
    });
    var abertas=todas.filter(function(t){ return t.status!=='pago'; });
    var pagas=todas.filter(function(t){ return t.status==='pago'; });
    return { atual: abertas[0]||null, futuras: abertas.slice(1), pagas: pagas, todas: todas };
  }
  function faturaItem(t, destaque){
    var link=safeUrl(t.link);
    var d=t.venc?dayDiff(t.venc):null;
    var atrasadaCls=atrasado(t)?' atrasado':'';
    var meta=[];
    if(t.parcela!=null) meta.push('parcela '+t.parcela);
    if(t.venc) meta.push(fmtDate(t.venc)+' · '+(atrasado(t)?'<span class="late">vencida</span>':relLabel(d)));

  // ---- aba: abastecimento ----
  function fmtLitros(n){ if(n==null) return ''; return (Math.round(n*100)/100).toFixed(2).replace('.',',')+' L'; }
  function fmtPreco(n){ if(n==null) return ''; return 'R$ '+n.toFixed(2).replace('.',',')+'/L'; }
  function catCombustivel(){
    var c=categorias.filter(function(x){ return x.tipo==='combustivel'; });
    return c[0]||null;
  }
  function abastOrd(cat){
    return (cat.avulsos||[]).slice().sort(function(a,b){ return a.d<b.d?1:(a.d>b.d?-1:0); });
  }
  function statsAbast(cat){
    var reg=cat.avulsos||[];
    var totV=0, totL=0;
    reg.forEach(function(a){ totV+=a.v||0; if(a.litros){ totL+=a.litros; } });
    var medioPond = totL>0 ? totV/totL : null;   // preço médio ponderado pelo litro
    return { n:reg.length, totV:Math.round(totV*100)/100, totL:Math.round(totL*100)/100, medio: medioPond };
  }
  function abastItem(cat, a){
    var partes=[];
    if(a.preco!=null) partes.push(fmtPreco(a.preco));
    if(a.litros!=null) partes.push(fmtLitros(a.litros));
    return '<div class="ab-row">'
      +'<div class="ab-date"><b>'+esc(fmtDate(a.d))+'</b><span>'+esc(relLabel(dayDiff(a.d)))+'</span></div>'
      +'<div class="ab-main">'+(a.o?'<span class="ab-tipo">'+esc(a.o)+'</span>':'')
        +(partes.length?'<span class="ab-sub">'+partes.join(' · ')+'</span>':'')+'</div>'
      +'<span class="ab-val money">'+esc(fmtBRL(a.v))+'</span>'
      +'<button class="icon-btn danger" data-act="delavulso" data-sid="'+esc(cat.id)+'" data-d="'+esc(a.d)+'" data-v="'+a.v+'" title="Remover este abastecimento" aria-label="Remover abastecimento de '+esc(fmtDate(a.d))+'">'+SVG_TRASH+'</button>'
      +'</div>';
  }
  function abastPorMes(cat){
    var reg=abastOrd(cat), grupos={}, ordem=[];
    reg.forEach(function(a){ var ym=mesDe(a.d); if(!grupos[ym]){ grupos[ym]=[]; ordem.push(ym); } grupos[ym].push(a); });
    return ordem.map(function(ym){
      var itens=grupos[ym];
      var soma=itens.reduce(function(s,a){ return s+(a.v||0); },0);
      return '<div class="ab-mes"><div class="ab-mes-h">'+esc(mesLabel(ym))
        +'<span class="ab-mes-tot money">'+esc(fmtBRL(soma))+'</span></div>'
        +itens.map(function(a){ return abastItem(cat, a); }).join('')+'</div>';
    }).join('');
  }
  function renderAbast(){
    var cat=catCombustivel();
    if(!cat){
      abastEl.innerHTML='<div class="empty"><p class="empty-big">Sem categoria de combustível.</p>'

    var tetoBloco='';
    if(teto){
      var pct=Math.max(0, Math.min(100, Math.round(usadoMes/teto*100)));
